name: edition-drift

# Does the regulation still say what this repo verified?
#
# Deliberately NOT part of the push CI. It depends on eCFR being reachable, and
# an upstream outage must not fail a build that has nothing to do with it. It
# runs weekly instead, and opens an issue when the regulation moves.
#
# The reason it exists: 14 CFR 25.535(d) specified a side load coefficient of
# 3.25 tan B from 1964 until 2022, when Amdt. 25-148 corrected it to 0.25 — a
# thirteenfold change, published inside a rule described as fixing typographical
# errors. The same amendment quietly changed which pressure case 25.525(b)
# points at. Nothing told anybody downstream. This is what tells us.

on:
  schedule:
    # Mondays, 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet pyyaml jsonschema certifi

      - name: Check the source registry against live eCFR
        id: check
        run: |
          set +e
          python tools/check_editions.py | tee drift.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open an issue if the regulation moved
        if: steps.check.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('drift.txt', 'utf8');
            const title = 'Edition drift: the regulation no longer reads as recorded';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'edition-drift',
            });
            const text = [
              '`tools/check_editions.py` found that at least one cited section has',
              'changed since it was verified.',
              '',
              'Re-read the affected sections against primary source, update every',
              'entry that cites them, record the superseded value in the entry\'s',
              '`history` block, and refresh `sources/` with the new digest and',
              'edition. Then log it in `docs/verification-log.md` — a value that',
              'changed under us is exactly what that log is for.',
              '',
              '```',
              body.trim(),
              '```',
            ].join('\n');
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body: text,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: text, labels: ['edition-drift'],
              });
            }

      - name: Fail the run so the schedule surfaces it
        if: steps.check.outputs.status != '0'
        run: exit 1
