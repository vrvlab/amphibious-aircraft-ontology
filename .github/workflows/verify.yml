name: verify

# The corpus makes claims about primary sources and about its own arithmetic.
# This workflow checks the second kind. The first kind is checked by a human
# reading the source, and that is what docs/verification-log.md records.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet pyyaml jsonschema

      - name: Schema, ids, cross-references, symbol declarations
        run: python tools/validate.py

      - name: Worked test cases reproduce
        run: python tools/run_tests.py --verbose

      - name: Validator self-checks
        # Each breaks a copy of the corpus one way at a time and requires the
        # validator to refuse it, so a rule cannot go quiet unnoticed.
        run: |
          python tools/test_validate_units.py
          python tools/test_validate_vocabularies.py

      - name: Build artifacts are current
        # dist/ is committed so consumers can vendor single files. Regenerating
        # must be a no-op; if it is not, someone edited the YAML without
        # rebuilding and the vendored artifact is stale.
        run: |
          python tools/build.py
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is stale — run python tools/build.py and commit the result"
            git --no-pager diff --stat -- dist/
            exit 1
          fi

