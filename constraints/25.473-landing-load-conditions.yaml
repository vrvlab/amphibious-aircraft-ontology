      S: 18750.0
    status: worked
  tags: *id005
- id: cfr-25.479-d2ii-drift-deflections
  title: Shock absorber and tire deflections in the drift condition — not evaluated
  kind: qualitative
  source:
    authority: 14 CFR
    section: 25.479(d)(2)(ii)
    url: https://www.ecfr.gov/current/title-14/section-25.479
    edition: 2026-07-07
    retrieved: 2026-08-05
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.479
    notes: '"The shock absorber and tire deflections must be assumed to be 75% of the deflection
      corresponding to the maximum ground reaction of § 25.473(a)(2). This load case need
      not be considered in combination with flat tires."

      NOT EVALUATED. Deflection sets the airframe attitude and the gear geometry at the instant
      of the load, which matters for where the load points and how long the effective arm
      is. A static beam sized on force magnitudes alone does not see it.'
  applicability:
    applies_when: The § 25.479(d)(2) drift condition
  tags:
  - ground-loads
  - subpart-c
  - landing
  - not-evaluated
  statement: The shock absorber and tire deflections must be assumed to be 75 percent of the
    deflection corresponding to the maximum ground reaction of § 25.473(a)(2). This load case
    need not be considered in combination with flat tires.
- id: cfr-25.479-d3-loads-act-at-the-axle
  title: Vertical and drag components act at the wheel axle centreline
  kind: assertion
  source:
    authority: 14 CFR
    section: 25.479(d)(3)
    url: https://www.ecfr.gov/current/title-14/section-25.479
    edition: 2026-07-07
    retrieved: 2026-08-05
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.479
    notes: '"The combination of vertical and drag components is considered to be acting at
      the wheel axle centerline."

      A short sentence with a large consequence for support structure. The loads do not arrive
      at the trunnion as a pure force: applied a strut length below it, drag arrives as a
      COUPLE of drag times that length, and side load arrives as torsion. Structure that reacts
      only the force is under-designed by whatever that couple is worth.

      EVALUATED ONLY WHEN A STRUT LENGTH IS SUPPLIED, because strut length is a landing gear
      dimension and this method takes wing geometry. The torsion is not carried at all.'
  applicability:
    applies_when: The § 25.479(d)(1) and (d)(2) ground load combinations
  tags:
  - ground-loads
  - subpart-c
  - landing
  - gear-support
  statement: The combination of vertical and drag components is considered to be acting at
    the wheel axle centerline.
