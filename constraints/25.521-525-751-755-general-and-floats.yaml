# 14 CFR §§ 25.521, 25.525 (Subpart C) and §§ 25.751, 25.755 (Subpart D)
# Text verified against eCFR issue 2026-07-07, retrieved 2026-07-20.

- id: cfr-25.521-b-applicability
  title: Water load method is a default path, not a hard requirement
  kind: qualitative
  source:
    authority: 14 CFR
    section: 25.521(b)
    url: https://www.ecfr.gov/current/title-14/section-25.521
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR full text
    notes: >-
      THIS IS THE MOST IMPORTANT SEMANTIC CONSTRAINT IN THE SUBPART and it is
      routinely lost in summarization. Exact text: "Unless a more rational analysis
      of the water loads is made, or the standards in ANC-3 are used, 25.523 through
      25.537 apply." Every constraint derived from 25.523-25.537 is therefore
      defeasible. A reasoner that treats them as mandatory will incorrectly reject
      valid designs substantiated by higher-fidelity analysis.
  statement: >-
    Sections 25.523 through 25.537 apply unless a more rational analysis of the
    water loads is made, or the standards in ANC-3 are used.
  applicability:
    superseded_by:
      - more rational analysis of water loads
      - ANC-3 standards

- id: cfr-25.521-c-amphibian-scope
  title: Water load requirements extend to amphibians
  kind: assertion
  source:
    authority: 14 CFR
    section: 25.521(c)
    url: https://www.ecfr.gov/current/title-14/section-25.521
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR full text
  statement: >-
    The requirements of 25.521 and 25.523 through 25.537 apply also to amphibians.

- id: cfr-25.525-d-aerodynamic-lift
  title: Aerodynamic lift assumption during water impact
  kind: bound
  source:
    authority: 14 CFR
    section: 25.525(d)
    url: https://www.ecfr.gov/current/title-14/section-25.525
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR full text
    notes: >-
      Carries an exception that secondary sources drop: "Except in the takeoff
      condition of 25.531". Encoding the 2/3 assumption unconditionally is wrong.
  bound:
    quantity: Aerodynamic lift during impact
    operator: "=="
    value: "(2/3) * W"
    units: lb
  applicability:
    applies_when: All impact conditions EXCEPT the takeoff condition of § 25.531

- id: cfr-25.525-c-twin-float-equivalent-hull
  title: Twin-float equivalent hull treatment
  kind: assertion
  source:
    authority: 14 CFR
    section: 25.525(c)
    url: https://www.ecfr.gov/current/title-14/section-25.525
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR full text
  statement: >-
    For twin float seaplanes, each float must be treated as an equivalent hull on a
    fictitious seaplane with a weight equal to one-half the weight of the twin float
    seaplane.

- id: cfr-25.751-a-main-float-buoyancy
  title: Main float buoyancy margin
  kind: bound
  source:
    authority: 14 CFR
    section: 25.751(a)
    url: https://www.ecfr.gov/current/title-14/section-25.751
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR full text
    notes: >-
      Exact text: "A buoyancy of 80 percent in excess of that required to support the
      maximum weight of the seaplane or amphibian in fresh water." Note "maximum
      weight", not "maximum design landing weight" -- secondary sources often
      substitute the latter. 80 percent in excess yields a 1.8 multiplier.
  bound:
    quantity: Main float buoyancy
    operator: ">="
    value: "1.8 * (buoyancy required to support maximum weight in fresh water)"
    units: lb

- id: interp-25.751-required-float-volume
  title: "INTERPRETATION: displaced volume implied by the 25.751(a) buoyancy margin"
  kind: formula
  source:
    authority: none
    section: n/a
    url: ""
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: interpretation
    checked_against: >-
      The 1.8 multiplier is regulatory (25.751(a), verified). The conversion
      from a buoyancy requirement to a displaced volume is not: it needs a
      water density, and § 25.751 specifies none.
    notes: >-
      Split out of cfr-25.751-a-main-float-buoyancy, where it had been carried
      as a worked example inside an otherwise purely regulatory entry. That
      placement let a non-regulatory constant (62.4 lb/ft3) inherit the parent
      entry's `verified` status by adjacency.

      Two engineering choices are folded in here and neither is in the rule.
      Fresh water density is taken as 62.4 lb/ft3 at about 60 F; it varies with
      temperature, and salt water is roughly 64 lb/ft3, which makes this the
      conservative choice for the fresh-water condition the section names.
      And the form below assumes the float alone supports the full maximum
      weight — for twin-float configurations see cfr-25.525-c-twin-float-equivalent-hull,
      under which each float is sized for half the seaplane weight.
  formula:
    expression: "V_req = 1.8 * W_max / rho_fresh"
    variables:
      - symbol: V_req
        description: Displaced volume the float must provide
        units: ft^3
      - symbol: W_max
        description: >-
          Maximum weight of the seaplane or amphibian. Note "maximum weight",
          not "maximum design landing weight" — see cfr-25.751-a-main-float-buoyancy.
        units: lb
      - symbol: rho_fresh
        description: >-
          Fresh water density. ENGINEERING VALUE, not regulatory. 62.4 lb/ft^3
          is the conventional figure.
        units: lb/ft^3
  test_cases:
    - description: Displaced volume for a single main float, fresh water
      inputs: {W_max: 120000.0, rho_fresh: 62.4}
      expected: {V_req: 3461.5385}
      status: worked
    - description: >-
        The same airframe as a twin float installation, each float sized for
        half the weight per 25.525(c). Half the volume each, so no margin is
        gained or lost by the split.
      inputs: {W_max: 60000.0, rho_fresh: 62.4}
      expected: {V_req: 1730.7692}
      status: worked
  tags: [water-loads, subpart-d, buoyancy, interpretation]

