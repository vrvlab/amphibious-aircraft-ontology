- id: cfr-25.755-a-hull-flooding-stability
  title: Hull flooding stability with two adjacent compartments flooded
  kind: qualitative
  source:
    authority: 14 CFR
    section: 25.755(a)
    url: https://www.ecfr.gov/current/title-14/section-25.755
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR full text
    notes: >-
      CORRECTION TO A COMMON MISSTATEMENT. The regulation requires a margin of
      positive stability great enough to "minimize the probability of capsizing" --
      NOT a zero capsizing probability, which several secondary sources assert and
      which is not an achievable engineering criterion. The regulation also does
      not specify a compartment count for hulls (unlike 25.751(b) for floats); it
      requires "enough watertight compartments" to meet the two-adjacent-flooded
      condition.
  statement: >-
    Each hull must have enough watertight compartments so that, with any two
    adjacent compartments flooded, the buoyancy of the hull and auxiliary floats
    (and wheel tires, if used) provides a margin of positive stability great enough
    to minimize the probability of capsizing in rough, fresh water.

- id: interp-25.755-gm-positive
  title: "INTERPRETATION: positive transverse metacentric height as a proxy criterion"
  kind: qualitative
  source:
    authority: none
    section: n/a
    url: ""
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: interpretation
    checked_against: >-
      Not present in 14 CFR 25.755. Included explicitly so that downstream users do
      not mistake it for regulatory text.
    notes: >-
      GM > 0 is a conventional naval-architecture proxy for "positive stability" and
      is a reasonable engineering criterion, but the regulation states a qualitative
      probability-minimization standard, not a metacentric height threshold. Any
      tool asserting GM > 0 as the Part 25 compliance criterion is substituting an
      interpretation for the rule. Flagged, not endorsed.
  statement: >-
    Positive transverse metacentric height (GM > 0) in the two-compartment-flooded
    condition is commonly used as a computable proxy for 25.755(a). It is an
    interpretation, not a regulatory requirement.

- id: cfr-25.525-b-load-distribution-pressure-floor
  title: Pressure floor when distributing the § 25.527 loads over the bottom
  kind: assertion
  source:
    authority: 14 CFR
    section: 25.525(b)
    url: https://www.ecfr.gov/current/title-14/section-25.525
    edition: 2026-07-07
    retrieved: 2026-08-14
  verification:
    status: verified
    checked_against: >-
      eCFR versioner API, full XML for title-14 § 25.525 at issues 2022-01-01
      and 2023-06-01, diffed
    notes: >-
      FOUND BY DIFFING THE REGULATION AGAINST ITSELF, not by reading it once.
      This paragraph was missing from the corpus entirely; the § 25.525 entries
      covered (c) and (d) only. It surfaced when the eCFR versions API showed
      § 25.525 among the sections Amdt. 25-148 touched.

      The amendment changed the cross-reference from § 25.533(b) to § 25.533(c).
      That is not cosmetic. (b) is the LOCAL pressure case, which sizes plating
      and stringers; (c) is the DISTRIBUTED case, which sizes frames, keel and
      chine. Distributing a resultant water load over the bottom is a
      distributed-pressure problem, so the corrected reference is the
      physically right one — and the corpus had already made that distinction
      the headline note of cfr-25.533-c1-c4-value before knowing the FAA had
      just corrected the regulation in the same direction.

      Anything built against the pre-2023 text applies a local-pressure floor
      where a distributed-pressure floor is now required. Since the local
      pressures are the larger of the two, the old reading is conservative in
      magnitude but wrong in design case, and it constrains the wrong structure.
  statement: >-
    In applying the loads resulting from the load factors prescribed in
    § 25.527, the loads may be distributed over the hull or main float bottom,
    in order to avoid excessive local shear loads and bending moments at the
    location of water load application, using pressures not less than those
    prescribed in § 25.533(c).
  applicability:
    applies_when: Distributing the § 25.527 water reaction loads over the bottom
    superseded_by:
      - cfr-25.521-b-applicability
  history:
    - effective_from: 1964-12-24
      effective_to: 2022-12-09
      amendment: >-
        Amdt. 25-148, Doc. No. FAA-2022-1355, 87 FR 75710 (9 December 2022),
        corrected at 88 FR 2813 (18 January 2023)
      superseded_value: "pressures not less than those prescribed in § 25.533(b)"
      substantive: true
      change: >-
        The floor referred to § 25.533(b), the local pressures for plating and
        stringers, rather than § 25.533(c), the distributed pressures for
        frames, keel and chine. A tool built on the old text applies the wrong
        design case: larger numbers, but against the wrong structure.
  tags: [water-loads, subpart-c, pressure, distributed, amended]
