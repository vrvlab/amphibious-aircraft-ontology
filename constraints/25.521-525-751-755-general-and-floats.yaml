- id: cfr-25.755-a-hull-flooding-stability
  title: Hull flooding stability with two adjacent compartments flooded
  kind: qualitative
  source:
    authority: 14 CFR
    section: 25.755(a)
    url: https://www.ecfr.gov/current/title-14/section-25.755
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR full text
    notes: >-
      CORRECTION TO A COMMON MISSTATEMENT. The regulation requires a margin of
      positive stability great enough to "minimize the probability of capsizing" --
      NOT a zero capsizing probability, which several secondary sources assert and
      which is not an achievable engineering criterion. The regulation also does
      not specify a compartment count for hulls (unlike 25.751(b) for floats); it
      requires "enough watertight compartments" to meet the two-adjacent-flooded
      condition.
  statement: >-
    Each hull must have enough watertight compartments so that, with any two
    adjacent compartments flooded, the buoyancy of the hull and auxiliary floats
    (and wheel tires, if used) provides a margin of positive stability great enough
    to minimize the probability of capsizing in rough, fresh water.

- id: interp-25.755-gm-positive
  title: "INTERPRETATION: positive transverse metacentric height as a proxy criterion"
  kind: qualitative
  source:
    authority: none
    section: n/a
    url: ""
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: interpretation
    checked_against: >-
      Not present in 14 CFR 25.755. Included explicitly so that downstream users do
      not mistake it for regulatory text.
    notes: >-
      GM > 0 is a conventional naval-architecture proxy for "positive stability" and
      is a reasonable engineering criterion, but the regulation states a qualitative
      probability-minimization standard, not a metacentric height threshold. Any
      tool asserting GM > 0 as the Part 25 compliance criterion is substituting an
      interpretation for the rule. Flagged, not endorsed.
  statement: >-
    Positive transverse metacentric height (GM > 0) in the two-compartment-flooded
    condition is commonly used as a computable proxy for 25.755(a). It is an
    interpretation, not a regulatory requirement.
