# ---------------------------------------------------------------------------
# § 25.523 — Design weights and center of gravity positions
# ---------------------------------------------------------------------------

- id: cfr-25.523-a-design-weights
  title: Which weight each water load condition is evaluated at
  kind: assertion
  source:
    authority: 14 CFR
    section: 25.523(a)
    url: https://www.ecfr.gov/current/title-14/section-25.523
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.523
    notes: >-
      Load conditions are met at EACH operating weight up to the design landing
      weight, not only at the design landing weight. A tool that evaluates a
      single point is not evaluating this section; the critical case need not be
      the heaviest one, because the load factor expressions of § 25.527 fall
      with W^(1/3) while the loads themselves rise with W.

      The takeoff condition of § 25.531 is the stated exception and uses the
      design water takeoff weight instead. So a complete water load assessment
      needs two distinct weights, and the corpus's W symbol does not mean the
      same thing in cfr-25.527-a1 (design landing weight) as in
      cfr-25.531-b-takeoff-inertia-load-factor (design water takeoff weight).
  statement: >-
    The water load requirements must be met at each operating weight up to the
    design landing weight, except that for the takeoff condition prescribed in
    § 25.531 the design water takeoff weight — the maximum weight for water taxi
    and takeoff run — must be used.
  tags: [water-loads, subpart-c, design-weights]

- id: cfr-25.523-b-critical-cg
  title: Critical center of gravity positions must be considered
  kind: assertion
  source:
    authority: 14 CFR
    section: 25.523(b)
    url: https://www.ecfr.gov/current/title-14/section-25.523
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.523
    notes: >-
      This is what makes r_x in cfr-25.527-a2 a swept quantity rather than a
      single number: r_x is measured from the CG, so moving the CG within the
      certified envelope changes K1/(1+r_x^2)^(2/3) at every station. A tool
      that fixes the CG at one position is not evaluating this paragraph.
  statement: >-
    The critical centers of gravity within the limits for which certification is
    requested must be considered to reach maximum design loads for each part of
    the seaplane structure.
  tags: [water-loads, subpart-c, center-of-gravity]

# ---------------------------------------------------------------------------
# § 25.529 — Hull and main float landing conditions
# ---------------------------------------------------------------------------

- id: cfr-25.529-a-symmetrical-landing-load-points
  title: Where the resultant water load acts in symmetrical landings
  kind: assertion
  source:
    authority: 14 CFR
    section: 25.529(a)
    url: https://www.ecfr.gov/current/title-14/section-25.529
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.529
    notes: >-
      § 25.527 gives the load factor; this section gives the point and direction
      of application, without which the load factor sizes nothing. The two bow
      and stern fractions here are NOT the same stations as the bow and stern
      breakpoints of Appendix B figure 2 — the figure runs to the extreme ends,
      while the load is applied at one-fifth and at 85 percent. Reading K1 at
      the figure's endpoint values for these cases overstates the bow case.
  statement: >-
    For symmetrical step, bow and stern landings the limit water reaction load
    factors are those computed under § 25.527. The resultant water load is
    applied at the keel and directed perpendicularly to the keel line, at:
    the center of gravity for a step landing; one-fifth of the longitudinal
    distance from the bow to the step for a bow landing; and 85 percent of the
    longitudinal distance from the step to the stern post for a stern landing.
  applicability:
    applies_when: Symmetrical step, bow and stern landings
    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, landing]

- id: cfr-25.529-b1-unsymmetrical-upward-component
  title: Unsymmetrical landing, upward load component
  kind: bound
  source:
    authority: 14 CFR
    section: 25.529(b)(1)
    url: https://www.ecfr.gov/current/title-14/section-25.529
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.529
    notes: >-
      Applies to hull and single float seaplanes. The upward component is
      REDUCED to 0.75 of the symmetrical resultant, not increased — the
      unsymmetrical case is critical for the side load and the sidewall path,
      not for the vertical one.
  bound:
    quantity: Upward load component, as a fraction of the corresponding symmetrical resultant
    operator: "=="
    value: 0.75
    units: dimensionless
  applicability:
    applies_when: Unsymmetrical step, bow and stern landings; hull and single float seaplanes
    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, landing, unsymmetrical]

- id: cfr-25.529-b1-unsymmetrical-side-component
  title: Unsymmetrical landing, side load component
  kind: formula
  source:
    authority: 14 CFR
    section: 25.529(b)(1)
    url: https://www.ecfr.gov/current/title-14/section-25.529
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.529
    notes: >-
      Stated in the text rather than as an image: "a side component equal,
      respectively, to 0.75 and 0.25 tan beta times the resultant load in the
      corresponding symmetrical landing condition".

      The side load GROWS with deadrise. A deep-V hull chosen to soften the
      vertical impact of § 25.527 pays for it here, and the two effects pull in
      opposite directions — which is why deadrise cannot be selected against the
      vertical case alone.
  formula:
    expression: "F_side = 0.25 * tan(beta) * R_symmetrical"
    variables:
      - symbol: F_side
        description: Side load component in the unsymmetrical landing condition
        units: lb
      - symbol: beta
        description: Angle of dead rise at the station being considered
        units: degrees
      - symbol: R_symmetrical
        description: >-
          Resultant load in the corresponding symmetrical landing condition,
          from cfr-25.529-a-symmetrical-landing-load-points
        units: lb
  applicability:
    applies_when: Unsymmetrical landings; hull and single float seaplanes
    superseded_by:
      - cfr-25.521-b-applicability
  test_cases:
    - description: Side load at 20 degrees deadrise, 50,000 lb symmetrical resultant
      inputs: {beta: 20.0, R_symmetrical: 50000.0}
      expected: {F_side: 4549.6289}
      status: worked
    - description: >-
        The same resultant on a 30 degree deadrise hull produces a 27% larger
        side load — the deep-V penalty this paragraph imposes.
      inputs: {beta: 30.0, R_symmetrical: 50000.0}
      expected: {F_side: 7216.8784}
      status: worked
  tags: [water-loads, subpart-c, landing, unsymmetrical]

- id: cfr-25.529-c-twin-float-unsymmetrical
  title: Unsymmetrical landing, twin float seaplanes
  kind: assertion
  source:
    authority: 14 CFR
    section: 25.529(c)
    url: https://www.ecfr.gov/current/title-14/section-25.529
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.529
    notes: >-
      The side load is applied at ONE float only, not both. Combined with
      cfr-25.525-c-twin-float-equivalent-hull, which sizes each float on half
      the seaplane weight, this is the condition that sets the float strut and
      carrythrough design.
  statement: >-
    The unsymmetrical loading consists of an upward load at the step of each
    float of 0.75, and a side load of 0.25 tan beta at one float, times the step
    landing load reached under § 25.527. The side load is directed inboard,
    perpendicularly to the plane of symmetry midway between the keel and chine
    lines of the float, at the same longitudinal station as the upward load.
  applicability:
    applies_when: Twin float seaplanes, unsymmetrical landing
    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, landing, unsymmetrical, twin-float]

# ---------------------------------------------------------------------------
# § 25.531 — Hull and main float takeoff condition
# ---------------------------------------------------------------------------

- id: cfr-25.531-a-zero-wing-lift
  title: Aerodynamic wing lift assumed zero in the takeoff condition
  kind: assertion
  source:
    authority: 14 CFR
    section: 25.531(a)
    url: https://www.ecfr.gov/current/title-14/section-25.531
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.531
    notes: >-
      THIS IS THE EXCEPTION cfr-25.525-d-aerodynamic-lift POINTS AT, and it is
      not a small one: § 25.525(d) assumes lift equal to two-thirds of the
      weight in every impact condition, and here it is zero. The wing carries
      none of the airframe and the whole inertia load goes into the hull-to-wing
      attachment. That is the design case for the carrythrough.

      Until this section was read, the corpus asserted the exception without
      knowing what it contained.
  statement: >-
    For the wing and its attachment to the hull or main float, the aerodynamic
    wing lift is assumed to be zero, and a downward inertia load corresponding
    to the load factor of cfr-25.531-b-takeoff-inertia-load-factor is applied.
  applicability:
    applies_when: Takeoff condition; wing and its attachment to the hull or main float
    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, takeoff]

- id: cfr-25.531-b-cto-value
  title: C_TO empirical seaplane operations factor, takeoff condition
  kind: bound
  source:
    authority: 14 CFR
    section: 25.531(b)
    url: https://www.ecfr.gov/current/title-14/section-25.531
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.531
    notes: >-
      C_TO = 0.004 is exactly one third of the C1 = 0.012 of § 25.527, and
      unlike C1 it carries no floor: nothing in § 25.531 raises it the way
      cfr-25.527-b2-step-load-factor-floor raises C1.
  bound:
    quantity: C_TO
    operator: "=="
    value: 0.004
    units: dimensionless
  applicability:
    applies_when: Takeoff condition of § 25.531
    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, takeoff]

- id: cfr-25.531-b-takeoff-inertia-load-factor
  title: Downward inertia load factor in the takeoff condition
  kind: formula
  source:
    authority: 14 CFR
    section: 25.531(b)
    url: https://www.ecfr.gov/current/title-14/section-25.531
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: >-
      eCFR versioner API full XML for title-14 § 25.531, plus the published
      formula image EC28SE91.038 read directly
    notes: >-
      Algebraically identical in form to the step landing case of
      cfr-25.527-a1, with three substitutions that all matter: C_TO = 0.004
      replaces C1 = 0.012, V_S1 (takeoff) replaces V_S0 (landing), beta is taken
      AT THE MAIN STEP specifically rather than at an arbitrary station, and W
      is the design water takeoff weight rather than the design landing weight.

      The regulation states W in pounds explicitly here, unlike § 25.337(b)
      where the unit had to be inferred.
  formula:
    expression: "n = (C_TO * V_S1^2) / ((tan(beta)^(2/3)) * W^(1/3))"
    latex: "n = \\frac{C_{TO} V_{S1}^2}{\\left(\\tan^{2/3}\\beta\\right) W^{1/3}}"
    source_render: https://img.federalregister.gov/EC28SE91.038/EC28SE91.038_large.png
    variables:
      - symbol: n
        description: Downward inertia load factor in the takeoff condition
        units: dimensionless
      - symbol: C_TO
        description: Empirical seaplane operations factor for takeoff
        units: dimensionless
        resolves_to: cfr-25.531-b-cto-value
      - symbol: V_S1
        description: >-
          Seaplane stalling speed at the design takeoff weight with the flaps
          extended in the appropriate takeoff position
        units: knots
      - symbol: beta
        description: Angle of dead rise AT THE MAIN STEP
        units: degrees
        resolves_to: Appendix B figure 1 (measurement convention; beta is a design input)
      - symbol: W
        description: >-
          Design water takeoff weight — the maximum weight for water taxi and
          takeoff run, per cfr-25.523-a-design-weights. Not the design landing
          weight used in § 25.527.
        units: lb
  applicability:
    applies_when: Takeoff condition; wing and its attachment to the hull or main float
    superseded_by:
      - cfr-25.521-b-applicability
  test_cases:
    - description: >-
        Mid-size flying boat at the design water takeoff weight. Compare the
        step landing case at the same geometry: C_TO being one third of C1
        makes this load factor one third of it too.
      inputs: {C_TO: 0.004, V_S1: 70.0, beta: 20.0, W: 30000.0}
      expected: {n: 1.2374}
      status: worked
    - description: >-
        A shallower step deadrise raises the factor: 12 degrees instead of 20
        gives a 43% larger downward inertia load on the wing attachment.
      inputs: {C_TO: 0.004, V_S1: 70.0, beta: 12.0, W: 30000.0}
      expected: {n: 1.7711}
      status: worked
  tags: [water-loads, subpart-c, takeoff, load-factor]

