# 14 CFR §§ 25.523, 25.529, 25.531, 25.535, 25.537
# Text verified against eCFR issue 2026-07-07, retrieved 2026-08-13, via the
# versioner API (api/versioner/v1/full/{date}/title-14.xml?...&section=NN).
#
# These five sections were the "not yet read" list in docs/verification-log.md.
# § 25.531 was read first because it was already a DANGLING REFERENCE: the
# encoded cfr-25.525-d-aerodynamic-lift carves out "the takeoff condition of
# § 25.531" as its one exception, so the corpus was pointing at a section it
