    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, auxiliary-float]

- id: cfr-25.535-b-deadrise-floor
  title: Auxiliary float deadrise floor of 15 degrees
  kind: bound
  source:
    authority: 14 CFR
    section: 25.535(b)
    url: https://www.ecfr.gov/current/title-14/section-25.535
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.535
    notes: >-
      "beta_S = angle of dead rise at a station 3/4 of the distance from the bow
      to the step, but need not be less than 15 degrees."

      This is relief, not a geometric limit. A float may physically have less
      than 15 degrees of deadrise; the designer simply need not use the smaller
      value in the load formula, which would otherwise blow up as tan beta
      falls. It is the regulation's own guard against the singularity that
      cfr-25.533-b1-keel-pressure has no equivalent protection from.
  bound:
    quantity: beta_S used in the cfr-25.535-b-step-load formula
    operator: ">="
    value: 15.0
    units: degrees
  applicability:
    applies_when: Auxiliary float step and bow loading
    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, auxiliary-float, deadrise]

- id: cfr-25.535-b-step-load
  title: Auxiliary float step loading limit load
  kind: formula
  source:
    authority: 14 CFR
    section: 25.535(b)
    url: https://www.ecfr.gov/current/title-14/section-25.535
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: >-
      eCFR versioner API full XML for title-14 § 25.535, plus the published
      formula image EC28SE91.042 read directly
    notes: >-
      Applied in the plane of symmetry of the float at three-quarters of the
      distance from the bow to the step, perpendicular to the keel. The same
      magnitude is applied for the bow loading case of § 25.535(c), at one
      quarter of that distance.

      W here is the SEAPLANE design landing weight, not the float's own
      displacement, and r_y is a ROLL radius of gyration ratio — the lateral
      analogue of the pitch ratio r_x in cfr-25.527-a2. Substituting r_x is a
      plausible and wrong reading.

      The cap in cfr-25.535-b-submerged-load-cap applies to this result.
  formula:
    expression: "L = (C5 * V_S0^2 * W^(2/3)) / ((tan(beta_S)^(2/3)) * (1 + r_y^2)^(2/3))"
    latex: "L = \\frac{C_5 V_{S0}^2 W^{2/3}}{\\tan^{2/3}\\beta_S \\left(1 + r_y^2\\right)^{2/3}}"
    source_render: https://img.federalregister.gov/EC28SE91.042/EC28SE91.042_large.png
    variables:
      - symbol: L
        description: Limit load on the auxiliary float
        units: lb
      - symbol: C5
        description: Empirical constant
        units: dimensionless
        resolves_to: cfr-25.535-b-c5-value
      - symbol: V_S0
        description: >-
          Seaplane stalling speed with landing flaps extended in the appropriate
          position and with no slipstream effect
        units: knots
      - symbol: W
        description: Seaplane design landing weight
        units: lb
      - symbol: beta_S
        description: >-
          Angle of dead rise at a station three-quarters of the distance from
          the bow to the step, subject to the 15 degree floor of
          cfr-25.535-b-deadrise-floor
        units: degrees
      - symbol: r_y
        description: >-
          Ratio of the lateral distance between the center of gravity and the
          plane of symmetry of the float, to the radius of gyration in ROLL
        units: dimensionless
  applicability:
    applies_when: Auxiliary float step loading, and by reference the bow loading of § 25.535(c)
    superseded_by:
      - cfr-25.521-b-applicability
  test_cases:
    - description: Wing-tip float on a 30,000 lb flying boat, 20 degree deadrise
      inputs: {C5: 0.0053, V_S0: 65.0, W: 30000.0, beta_S: 20.0, r_y: 1.5}
      expected: {L: 19329.3507}
      status: worked
    - description: >-
        The 15 degree floor is what a shallow float gets. A true 8 degree
        deadrise would give 36452 lb here; the floor caps the design load at
        23708 lb, 35% lower. That is why cfr-25.535-b-deadrise-floor is relief
        and not a geometric limit.
      inputs: {C5: 0.0053, V_S0: 65.0, W: 30000.0, beta_S: 15.0, r_y: 1.5}
      expected: {L: 23707.8886}
      status: worked
  tags: [water-loads, subpart-c, auxiliary-float]

- id: cfr-25.535-b-submerged-load-cap
  title: Auxiliary float load capped at three times displaced water weight
  kind: bound
  source:
    authority: 14 CFR
    section: 25.535(b)
    url: https://www.ecfr.gov/current/title-14/section-25.535
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.535
    notes: >-
      "except that the value of L need not exceed three times the weight of the
      displaced water when the float is completely submerged".

      A physical ceiling on an empirical formula: once the float is fully under,
      it cannot generate more reaction regardless of what the expression says.
      This is the term that couples auxiliary float LOADS to auxiliary float
      VOLUME, and therefore the one that stops a sizing loop from shrinking a
      float to reduce its own design load.
  bound:
    quantity: L, the auxiliary float limit load of cfr-25.535-b-step-load
    operator: "<="
    value: "3 * (weight of water displaced by the fully submerged float)"
    units: lb
  applicability:
    applies_when: Auxiliary float step and bow loading
    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, auxiliary-float]

- id: cfr-25.535-f-immersed-vertical
  title: Immersed float condition, vertical load component
  kind: formula
  source:
    authority: 14 CFR
    section: 25.535(f)
    url: https://www.ecfr.gov/current/title-14/section-25.535
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: >-
      eCFR versioner API full XML for title-14 § 25.535, plus the published
      formula image EC28SE91.043 read directly
    notes: >-
      Applied at the centroid of the float cross section at one-third of the
      distance from the bow to the step. This is plain buoyancy — the fully
      submerged float displacing its own volume of water.

      UNITS NOTE. The eCFR XML prints both rho and V as "ft.2", which is a
      mangled superscript: the source has ft^3 in both places. Dimensional
      analysis settles it — rho * g * V must yield lbf, so rho is slug/ft^3 and
      V is ft^3. The corpus records the corrected units, not the rendered ones.
  formula:
    expression: "F_vertical = rho * g * V"
    latex: "F_{vertical} = \\rho g V"
    source_render: https://img.federalregister.gov/EC28SE91.043/EC28SE91.043_large.png
    variables:
      - symbol: F_vertical
        description: Vertical load component in the immersed float condition
        units: lb
      - symbol: rho
        description: Mass density of water
        units: slug/ft^3
      - symbol: g
        description: Acceleration due to gravity
        units: ft/s^2
      - symbol: V
        description: Volume of the float
        units: ft^3
  applicability:
    applies_when: Immersed float condition
    superseded_by:
      - cfr-25.521-b-applicability
  test_cases:
    - description: >-
        A 50 ft^3 float fully immersed in fresh water. rho = 1.9384 slug/ft^3
        and g = 32.174 ft/s^2 are engineering values, not regulatory ones; the
        result is the familiar 62.37 lb per cubic foot of displacement.
      inputs: {rho: 1.9384, g: 32.174, V: 50.0}
      expected: {F_vertical: 3118.3041}
      status: worked
  tags: [water-loads, subpart-c, auxiliary-float, immersed]

- id: cfr-25.535-f-immersed-drag-and-side
  title: Immersed float condition, aft and side load components
  kind: formula
  source:
    authority: 14 CFR
    section: 25.535(f)
    url: https://www.ecfr.gov/current/title-14/section-25.535
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: >-
      eCFR versioner API full XML for title-14 § 25.535, plus the published
      formula image EC28SE91.043 read directly
    notes: >-
      Both components share one form, differing only in coefficient: C_x = 0.133
      for the aft component and C_y = 0.106 for the side component. The
      expression below is stated once with a generic C; bind C to whichever is
      wanted.

      K = 0.8, except that lower values may be used if it is shown that the
      floats are incapable of submerging at a speed of 0.8 V_S0 in normal
      operations.

      UNIT AMBIGUITY, RECORDED RATHER THAN RESOLVED. This is the only water load
      formula in Subpart C written in genuine physical quantities — it contains
      an explicit rho and a dynamic-pressure form (rho/2) * area * speed^2 —
      rather than being an empirical fit whose constants silently absorb the
      units. Every other expression here takes V_S0 or V_S1 in knots because the
      empirical constant was fitted that way. Here the dimensions must close on
      their own, and they only do so with the speed in ft/s: slug/ft^3 * ft^2 *
      (ft/s)^2 = lbf. The regulation's own glossary nevertheless says knots, and
      using knots directly changes the answer by a factor of 1.688^2 = 2.85.

      The corpus does not assert which is correct, because the section does not
      say and no primary source consulted resolves it. The test case below is
      therefore `pending`, not `worked`. See docs/verification-log.md, Round 3,
      and the open item it records.
  formula:
    expression: "F = C * (rho / 2) * V^(2/3) * (K * V_S0)^2"
    latex: "F = C \\frac{\\rho}{2} V^{2/3} \\left(K V_{S0}\\right)^2"
    source_render: https://img.federalregister.gov/EC28SE91.043/EC28SE91.043_large.png
    variables:
      - symbol: F
        description: Aft or side load component, according to which coefficient C is bound
        units: lb
      - symbol: C
        description: >-
          Force coefficient. C_x = 0.133 for the aft (drag) component, C_y =
          0.106 for the side component.
        units: dimensionless
      - symbol: rho
        description: Mass density of water
        units: slug/ft^3
      - symbol: V
        description: Volume of the float
        units: ft^3
      - symbol: K
        description: >-
          Submergence factor, 0.8, except that lower values may be used if the
          floats are shown incapable of submerging at 0.8 V_S0 in normal
          operations
        units: dimensionless
      - symbol: V_S0
        description: >-
          Seaplane stalling speed with landing flaps extended and no slipstream
          effect. The section states KNOTS. That is what the regulation says and
          it is recorded here unaltered — but the expression does not close
          dimensionally on knots. See interp-25.535-f-speed-units, which is
          where the choice is made and where the arithmetic lives.
        units: knots (as stated; see interp-25.535-f-speed-units)
  applicability:
    applies_when: Immersed float condition
    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, auxiliary-float, immersed]

- id: interp-25.535-f-speed-units
  title: "INTERPRETATION: speed units in the immersed float drag and side components"
  kind: formula
  source:
    authority: none
    section: n/a
    url: ""
    edition: 2026-07-07
    retrieved: 2026-08-14
  verification:
    status: interpretation
    checked_against: >-
      Not resolvable from 14 CFR. The stated unit was confirmed to be "knots" in
      two independent renderings of the section — the current eCFR XML and the
      typeset printed CFR (GPO, 14 CFR Ch. I, 1-1-11 edition, p. 418) — so it is
      not an eCFR artifact. No FAA advisory material, and no primary source
      consulted, states which unit closes the equation.
    notes: >-
      WHAT IS ESTABLISHED, from the printed CFR rather than inferred:

      rho is slugs/ft^3 and V is ft^3. The eCFR XML renders both as "ft.2",
      which the typeset CFR shows to be a mangled superscript. An earlier
      revision of this corpus reached the same conclusion by dimensional
      analysis alone; it is now read from the source, per the Round 2 process
      change.

      WHY THE UNIT MATTERS AND WHY IT CANNOT BE READ OFF THE PAGE:

      This is the only water load expression in Subpart C written in genuine
      physical quantities. Every other one — cfr-25.527-a1, cfr-25.533-b1-keel-pressure,
      cfr-25.535-b-step-load — is an empirical fit whose constant silently
      absorbs the units, which is why knots is unremarkable there. Here the
      form is C * (rho/2) * area * speed^2, the textbook dynamic pressure, and
      C_x and C_y are called "coefficient of drag force" and "coefficient of
      side force" — the language of dimensionless coefficients, not of fitted
      constants. Such an expression closes on slug/ft^3 * ft^2 * (ft/s)^2 = lbf
      and on nothing else.

      The companion component in the same load set settles that the drafters
      were working in consistent units: cfr-25.535-f-immersed-vertical is
      rho * g * V, which is exactly lbf with rho in slug/ft^3 and V in ft^3 and
      needs no fitted constant at all. One load set cannot coherently use
      consistent units for its vertical component and knots for its horizontal
      ones.

      Against that, the section plainly says knots, and it survived a targeted
      FAA technical-corrections pass over this very section in 2022 — Amdt.
      25-148 fixed a genuine typo in paragraph (d) and left paragraph (f)
      alone. That is real evidence, though a corrections pass fixes what has
      been reported rather than everything that is wrong.

      THE CHOICE MADE HERE, AND WHY:

      ft/s. Two reasons, in order. First, it is the only reading under which
      the expression is the drag equation it visibly is. Second, it is the
      conservative one for a strength requirement: it yields loads 1.68781^2 =
      2.849 times larger, and a float strut sized to the larger number
      satisfies the smaller. Choosing the other way round would be choosing
      the unconservative reading of an ambiguous rule.

      This is an INTERPRETATION and is labelled one. A certification programme
      must obtain FAA agreement rather than rely on this entry; § 25.521(b)
      makes the whole method defeasible by a more rational analysis in any
      case. If the FAA ever states the unit, this entry gets retracted in
      docs/verification-log.md rather than quietly edited.
  formula:
    expression: "F = C * (rho / 2) * V^(2/3) * (K * V_S0_kt * 1.68781)^2"
    latex: "F = C \\frac{\\rho}{2} V^{2/3} \\left(K V_{S0} \\cdot 1.68781\\right)^2"
    variables:
      - symbol: F
        description: Aft or side load component, according to which coefficient C is bound
        units: lb
      - symbol: C
        description: >-
          Force coefficient. C_x = 0.133 for the aft component, C_y = 0.106 for
          the side component. Both from cfr-25.535-f-immersed-drag-and-side.
        units: dimensionless
      - symbol: rho
        description: Mass density of water
        units: slug/ft^3
      - symbol: V
        description: Volume of the float
        units: ft^3
      - symbol: K
        description: Submergence factor, 0.8 unless a lower value is substantiated
        units: dimensionless
      - symbol: V_S0_kt
        description: >-
          Seaplane stalling speed in KNOTS, as the section states it. The
          1.68781 factor converts to ft/s inside the expression rather than
          outside it, so that a caller supplies the quantity the regulation
          names and the interpretation stays visible in the formula.
        units: knots
  applicability:
    applies_when: Immersed float condition of § 25.535(f)
    superseded_by:
      - cfr-25.521-b-applicability
      - >-
        An FAA statement of the intended unit, which would retire this entry
        entirely
  test_cases:
    - description: >-
        Aft component on a 50 ft^3 float at 65 kt. Under the literal knots
        reading the same inputs give 4730.6 lb; the 2.849 ratio between them is
        the whole of the question.
      inputs: {C: 0.133, rho: 1.9384, V: 50.0, K: 0.8, V_S0_kt: 65.0}
      expected: {F: 13476.1400}
      status: worked
    - description: Side component on the same float, C_y = 0.106
      inputs: {C: 0.106, rho: 1.9384, V: 50.0, K: 0.8, V_S0_kt: 65.0}
      expected: {F: 10740.3823}
      status: worked
    - description: >-
        The drag component exceeds the buoyancy of the same float by a factor
        of 4.3 — cfr-25.535-f-immersed-vertical gives 3118.3 lb for 50 ft^3.
        A fully submerged float dragged at 52 kt really is drag-dominated, which
        is the physical check that the larger reading is the sensible one.
      inputs: {C: 0.133, rho: 1.9384, V: 50.0, K: 0.8, V_S0_kt: 65.0}
      expected: {F: 13476.1400}
      status: worked
  tags: [water-loads, subpart-c, auxiliary-float, immersed, interpretation]

- id: cfr-25.535-g-auxiliary-float-k2
  title: Auxiliary float bottom pressures use K2 = 1.0
  kind: bound
  source:
    authority: 14 CFR
    section: 25.535(g)
    url: https://www.ecfr.gov/current/title-14/section-25.535
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.535
    notes: >-
      "The float bottom pressures must be established under § 25.533, except
      that the value of K2 in the formulae may be taken as 1.0."

      So the § 25.533 pressure formulas apply to auxiliary floats with the
      station weighting switched off entirely — no bow factor of 2.0, no
      interior minimum of 0.75. A tool that reuses its hull K2 lookup for
      auxiliary floats will over-predict the bow and under-predict mid-forebody.
      The deadrise to use is beta_S from § 25.535(b), not the hull's.
  bound:
    quantity: K2 in the § 25.533 pressure formulas, applied to auxiliary floats
    operator: "=="
    value: 1.0
    units: dimensionless
  applicability:
    applies_when: Auxiliary float bottom pressures
    superseded_by:
      - cfr-25.521-b-applicability
  tags: [water-loads, subpart-c, auxiliary-float, pressure]

