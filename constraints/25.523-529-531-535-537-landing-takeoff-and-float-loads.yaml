- id: cfr-25.537-seawing-test-data
  title: Seawing loads must be based on test data
  kind: assertion
  source:
    authority: 14 CFR
    section: "25.537"
    url: https://www.ecfr.gov/current/title-14/section-25.537
    edition: 2026-07-07
    retrieved: 2026-08-13
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.537
    notes: >-
      The section is one sentence and supplies no method at all. It is encoded
      because its emptiness is load-bearing: a seawing configuration has NO
      default analytical path in Subpart C, so a tool asked to size one must
      decline rather than fall back on the hull formulas. This closes the last
      of the previously unread §§ 25.523-25.537.
  statement: >-
    Seawing design loads must be based on applicable test data.
  applicability:
    applies_when: Seawing configurations
  tags: [water-loads, subpart-c, seawing, no-default-method]

- id: cfr-25.535-d-unsymmetrical-step-loading
  title: Auxiliary float unsymmetrical step loading
  kind: formula
  source:
    authority: 14 CFR
    section: 25.535(d)
    url: https://www.ecfr.gov/current/title-14/section-25.535
    edition: 2026-07-07
    retrieved: 2026-08-14
  verification:
    status: verified
    checked_against: >-
      eCFR versioner API, full XML for title-14 § 25.535 at issues 2022-01-01
      and 2023-06-01, diffed; and the typeset printed CFR (GPO, 14 CFR Ch. I,
      1-1-11 edition, p. 418)
    notes: >-
      THIS COEFFICIENT WAS WRONG IN THE REGULATION FOR FIFTY-EIGHT YEARS.

      From the 1964 original until 2022 the section read "a side component
      equal to 3.25 tan beta". Amdt. 25-148 (87 FR 75710, 9 December 2022,
      corrected at 88 FR 2813, 18 January 2023) changed it to 0.25 tan beta as
      part of a Miscellaneous Amendments rule addressing typographical and
      editorial errors. The 2011 printed CFR still shows 3.25.

      The correction is a THIRTEENFOLD REDUCTION in the unsymmetrical step side
      load. Any tool, textbook or type-certification basis built on a pre-2023
      copy of Part 25 carries the larger figure. That the error stood for
      fifty-eight years, in a paragraph whose sibling (e) had 0.25 all along,
      is the strongest argument in this corpus for the `edition` field being
      mandatory on every entry.

      Concretely, on the wing-tip float of cfr-25.535-b-step-load's worked case
      — L = 19329.35 lb at 20 degrees deadrise — the side load is 1758.83 lb
      under the rule in force and 22864.75 lb under the text that stood until
      2022.

      The 0.25 value is also what harmonises (d) with (e), with
      cfr-25.529-b1-unsymmetrical-side-component for hulls, and with
      § 25.529(c) for twin floats, all of which use 0.25 tan beta.

      A SEPARATE DEFECT REMAINS, UNCORRECTED. The paragraph takes 0.75 times
      "the load specified in paragraph (a)", but (a) is the General paragraph
      and specifies no load at all; the step load is in (b). The 2022 pass
      fixed the coefficient in this sentence and left the dangling reference
      beside it. Read as written the vertical component is undefined. This
      corpus binds it to the (b) step load, which is what (e) does for the bow
      case and the only reading that makes the paragraph operable — an
      engineering reading, not a regulatory one.
  formula:
    expression: "F_side = 0.25 * tan(beta) * L"
    variables:
      - symbol: F_side
        description: >-
          Side component of the unsymmetrical step load on an auxiliary float
        units: lb
      - symbol: beta
        description: Angle of dead rise at the station considered
        units: degrees
      - symbol: L
        description: >-
          Auxiliary float step limit load from cfr-25.535-b-step-load, which is
          the load "specified in paragraph (b)"
        units: lb
        resolves_to: cfr-25.535-b-step-load
  applicability:
    applies_when: Auxiliary float unsymmetrical step loading
    superseded_by:
      - cfr-25.521-b-applicability
  test_cases:
    - description: >-
        Side load on the wing-tip float of cfr-25.535-b-step-load's worked case
        (L = 19329.35 lb at 20 degrees deadrise), under the corrected 0.25. The
        pre-2023 text would have given 22864.75 lb for the same float — that
        comparison lives in the notes rather than here, because this entry
        encodes the rule in force and cannot also evaluate the superseded one.
      inputs: {beta: 20.0, L: 19329.3507}
      expected: {F_side: 1758.8271}
      status: worked
  history:
    - effective_from: 1964-12-24
      effective_to: 2022-12-09
      amendment: >-
        Amdt. 25-148, Doc. No. FAA-2022-1355, 87 FR 75710 (9 December 2022),
        corrected at 88 FR 2813 (18 January 2023)
      superseded_value: "3.25 * tan(beta) * L"
      substantive: true
      change: >-
        The side load coefficient was 3.25, not 0.25 — a factor of thirteen.
        An airplane whose certification basis is Part 25 at any amendment level
        below 25-148 was judged against the larger figure, so a design review
        reading this entry for such an aircraft must use the history value and
        not the current one. On the worked float of cfr-25.535-b-step-load that
        is 22864.75 lb rather than 1758.83 lb.

        The correction arrived inside a Miscellaneous Amendments rule described
        as addressing typographical and editorial errors. Nothing about the
        publication signalled that a load had moved by an order of magnitude.
  tags: [water-loads, subpart-c, auxiliary-float, unsymmetrical, amended]

- id: cfr-25.535-e-unsymmetrical-bow-loading
  title: Auxiliary float unsymmetrical bow loading
  kind: formula
  source:
    authority: 14 CFR
    section: 25.535(e)
    url: https://www.ecfr.gov/current/title-14/section-25.535
    edition: 2026-07-07
    retrieved: 2026-08-14
  verification:
    status: verified
    checked_against: >-
      eCFR versioner API, full XML for title-14 § 25.535, and the typeset
      printed CFR (GPO, 1-1-11 edition, p. 418)
    notes: >-
      Unlike (d), this paragraph read 0.25 tan beta from the start and was not
      touched by Amdt. 25-148. Its cross-references are also coherent: the
      upward component is 0.75 of the (b) step load and the side component is
      referred to the (c) bow load, whose magnitude (c) defines as equal to the
      step load anyway. So (d) and (e) now produce the same side load, which is
      further evidence that 3.25 was a typographical error rather than a
      deliberate distinction.
  formula:
    expression: "F_side = 0.25 * tan(beta) * L"
    variables:
      - symbol: F_side
        description: >-
          Side component of the unsymmetrical bow load on an auxiliary float
        units: lb
      - symbol: beta
        description: Angle of dead rise at the station considered
        units: degrees
      - symbol: L
        description: >-
          Bow limit load per § 25.535(c), whose magnitude equals the step load
          of cfr-25.535-b-step-load
        units: lb
        resolves_to: cfr-25.535-b-step-load
  applicability:
    applies_when: Auxiliary float unsymmetrical bow loading
    superseded_by:
      - cfr-25.521-b-applicability
  test_cases:
    - description: Same float and deadrise as the step case; the two now agree
      inputs: {beta: 20.0, L: 19329.3507}
      expected: {F_side: 1758.8271}
      status: worked
  tags: [water-loads, subpart-c, auxiliary-float, unsymmetrical]
