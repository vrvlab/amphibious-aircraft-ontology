# 14 CFR § 25.527 — Hull and main float load factors
# Text verified against eCFR issue 2026-07-07, retrieved 2026-07-20.

- id: cfr-25.527-a1
  title: Step landing water reaction load factor
  kind: formula
  source:
    authority: 14 CFR
    section: 25.527(a)(1)
    url: https://www.ecfr.gov/current/title-14/section-25.527
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR enhanced renderer API + published formula image EC28SE91.036
    notes: >-
      Formula confirmed by reading the raster image the regulation publishes in place
      of the equation. beta is a design input whose measurement convention is defined
      by Appendix B figure 1; see cfr-25-appB-fig1-deadrise-definition.
  formula:
    expression: "n_w = (C1 * V_S0^2) / ((tan(beta)^(2/3)) * W^(1/3))"
    latex: "n_w = \\frac{C_1 V_{S0}^2}{\\left(\\tan^{2/3}\\beta\\right) W^{1/3}}"
    source_render: https://img.federalregister.gov/EC28SE91.036/EC28SE91.036_large.png
    variables:
      - symbol: n_w
        description: Water reaction load factor (water reaction divided by seaplane weight)
        units: dimensionless
      - symbol: C1
        description: Empirical seaplane operations factor
        units: dimensionless
      - symbol: V_S0
        description: >-
          Seaplane stalling speed with flaps extended in the appropriate landing
          position, no slipstream effect
        units: knots
      - symbol: beta
        description: Angle of dead rise at the longitudinal station where the load factor is determined
        units: degrees
        resolves_to: Appendix B figure 1 (measurement convention; beta is a design input)
      - symbol: W
        description: Seaplane design landing weight
        units: lb

- id: cfr-25.527-a2
  title: Bow and stern landing water reaction load factor
  kind: formula
  source:
    authority: 14 CFR
    section: 25.527(a)(2)
    url: https://www.ecfr.gov/current/title-14/section-25.527
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR + published formula image EC28SE91.037
    notes: >-
      K1 is supplied exactly by Appendix B figure 2, which is piecewise linear with all
      breakpoints labelled; see cfr-25-appB-fig2-k1.
  formula:
    expression: "n_w = ((C1 * V_S0^2) / ((tan(beta)^(2/3)) * W^(1/3))) * (K1 / (1 + r_x^2)^(2/3))"
    latex: "n_w = \\frac{C_1 V_{S0}^2}{\\left(\\tan^{2/3}\\beta\\right) W^{1/3}} \\times \\frac{K_1}{\\left(1 + r_x^2\\right)^{2/3}}"
    source_render: https://img.federalregister.gov/EC28SE91.037/EC28SE91.037_large.png
    variables:
      # The four symbols carried over from (a)(1) are redeclared in full rather
      # than inherited. An entry has to be resolvable on its own: a consumer that
      # pins cfr-25.527-a2 must not have to know that a sibling entry exists.
      - symbol: n_w
        description: Water reaction load factor (water reaction divided by seaplane weight)
        units: dimensionless
      - symbol: C1
        description: Empirical seaplane operations factor, as in 25.527(a)(1)
        units: dimensionless
        resolves_to: cfr-25.527-b2-c1-value
      - symbol: V_S0
        description: >-
          Seaplane stalling speed with flaps extended in the appropriate landing
          position, no slipstream effect
        units: knots
      - symbol: beta
        description: Angle of dead rise at the longitudinal station where the load factor is determined
        units: degrees
        resolves_to: Appendix B figure 1 (measurement convention; beta is a design input)
      - symbol: W
        description: Seaplane design landing weight
        units: lb
      - symbol: K1
        description: Empirical hull station weighing factor
        units: dimensionless
        resolves_to: cfr-25-appB-fig2-k1 (exact, piecewise linear)
      - symbol: r_x
        description: >-
          Ratio of the distance (parallel to the hull reference axis) from the CG to
          the hull longitudinal station being computed, to the pitch radius of gyration.
          The hull reference axis is a straight line in the plane of symmetry,
          tangential to the keel at the main step.
        units: dimensionless

- id: cfr-25.527-b2-c1-value
  title: Empirical seaplane operations factor and minimum step load factor
  kind: bound
  source:
    authority: 14 CFR
    section: 25.527(b)(2)
    url: https://www.ecfr.gov/current/title-14/section-25.527
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR full text
    notes: >-
      Exact regulatory wording: "C1 = empirical seaplane operations factor equal to
      0.012 (except that this factor may not be less than that necessary to obtain
      the minimum value of step load factor of 2.33)". Note the floor is expressed
      as a constraint on C1 sufficient to achieve n_w >= 2.33 for the step case --
      it is NOT a blanket floor on n_w in all cases. Secondary sources routinely
      state this imprecisely.
  bound:
    quantity: C1
    operator: "=="
    value: 0.012
    units: dimensionless

- id: cfr-25.527-b2-step-load-factor-floor
  title: Minimum step landing load factor, obtained by raising C1
  kind: bound
  source:
    authority: 14 CFR
    section: 25.527(b)(2)
    url: https://www.ecfr.gov/current/title-14/section-25.527
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR versioner API, full XML for title-14 § 25.527
    notes: >-
      Promoted from a `notes_additional_bound` key on cfr-25.527-b2-c1-value,
      which no schema declared and therefore no consumer could read. It was
      nonetheless being implemented by a downstream design tool, i.e. a
      load-bearing rule was travelling as a comment.

      The floor operates on C1, not on n_w: the parenthesis reads "except that
      this factor may not be less than that necessary to obtain the minimum
      value of step load factor of 2.33". So C1 is raised until the STEP case
      reaches 2.33; it is not a blanket floor applied to n_w at every station.
      Once C1 is raised, the higher value flows through 25.527(a)(2) and
      through C4 in 25.533(c)(1), which is defined as 0.078 C1.
  bound:
    quantity: n_w in the step landing case of 25.527(a)(1), after raising C1 if required
    operator: ">="
    value: 2.33
    units: dimensionless
  applicability:
    applies_when: Step landing case only
  test_cases:
    - description: >-
        Nominal C1 already clears the floor, so nothing is raised. Large flying
        boat — the floor is slack across the whole transport range.
      via: cfr-25.527-a1
      inputs: {C1: 0.012, V_S0: 100.0, beta: 20.0, W: 120000.0}
      expected: {n_w: 4.7725}
      status: worked
    - description: >-
        Nominal C1 falls short. The floor bites at low weight and low stalling
        speed — the light-seaplane end, not the transport end.
      via: cfr-25.527-a1
      inputs: {C1: 0.012, V_S0: 35.0, beta: 25.0, W: 4000.0}
      expected: {n_w: 1.5400}
      status: worked
    - description: >-
        The same seaplane with C1 raised to the least value that satisfies the
        floor reaches the 2.33 step load factor exactly. Stated as a forward
        evaluation so the required C1 is checked arithmetically rather than
        restated as a constant.
      via: cfr-25.527-a1
      inputs: {C1: 0.018156, V_S0: 35.0, beta: 25.0, W: 4000.0}
      expected: {n_w: 2.3300}
      status: worked
  tags: [water-loads, subpart-c, load-factor]

- id: cfr-25.527-c-twin-float-k1-reduction
  title: Twin-float K1 reduction at bow and stern
  kind: bound
  source:
    authority: 14 CFR
    section: 25.527(c)
    url: https://www.ecfr.gov/current/title-14/section-25.527
    edition: 2026-07-07
    retrieved: 2026-07-20
  verification:
    status: verified
    checked_against: eCFR full text
    notes: >-
      Permissive, not mandatory ("may be reduced"). Applies only to the design of
      the carrythrough and seaplane structure. Encoding this as a required
      reduction would be incorrect.
  bound:
    quantity: K1 (twin float, bow and stern stations)
    operator: ">="
    value: "0.8 * K1_figure2"
    units: dimensionless
  applicability:
    applies_when: Twin float seaplane; design of carrythrough and seaplane structure only
