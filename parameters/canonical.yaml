# Canonical parameter vocabulary.
#
# The constraint corpus says what the regulations require. This file says what
# the quantities in those requirements are CALLED, what units they carry, and
# where their bounds come from.
#
# It exists because three consumers independently invented three vocabularies
# for the same hull, and each lost something different in the process:
#
#   * all three collapse the two distinct deadrise angles of Subpart C into a
#     single `deadrise_deg`. AeroGit's facet documents the loss in its own
#     description; nothing checks it.
#   * Loftline admits `deadrise_deg = 0.0` inclusive, which makes
#     cfr-25.533-b1-keel-pressure singular. AeroGit made the same bound
#     exclusive for exactly that reason. Same quantity, contradictory bounds,
#     and the permissive one sits upstream of the geometry.
#   * "forebody fraction" names two different things — a regulatory station
#     convention and a hydrodynamic spray length — which are not interchangeable.
#
# Bounds here carry a `bounds_basis`. Only `regulatory` and `mathematical`
# bounds may be enforced as a rejection. A `conceptual` bound is a sanity range
# and must be reported, not enforced — rejecting a valid unusual design is the
# failure mode this whole corpus is built to avoid.

# ---------------------------------------------------------------------------
# Deadrise — the parameter the ecosystem gets wrong
# ---------------------------------------------------------------------------

- name: geometry.hull.deadrise_keel_deg
  title: Angle of dead rise at the keel
  symbol: beta_k
  units: degrees
  description: >-
    Deadrise measured at the keel specifically. For an unflared bottom this
    equals the station deadrise; for a flared bottom the two differ and this is
    the steeper of the pair.
  bounds:
    min: 0.0
    min_exclusive: true
    max: 60.0
  bounds_basis: mathematical
  bounds_rationale: >-
    cfr-25.533-b1-keel-pressure divides by tan(beta_k), so zero is singular
    rather than merely unusual. The upper figure is conceptual and must not be
    enforced as a rejection.
  used_by:
    - cfr-25.533-b1-keel-pressure
  distinct_from:
    - geometry.hull.deadrise_station_deg
    - geometry.hull.deadrise_step_deg
  notes: >-
    A consumer supplying one deadrise value for both this and
    geometry.hull.deadrise_station_deg is making the unflared assumption. That
    is a legitimate conceptual simplification — it is only a defect when it is
    silent, because it makes the flared path of cfr-25.533-b2-flared-chine-pressure
    unreachable without anyone noticing.

- name: geometry.hull.deadrise_station_deg
  title: Angle of dead rise at the longitudinal station under consideration
  symbol: beta
  units: degrees
  description: >-
    Deadrise at whichever station a load or pressure is being computed for. A
    swept quantity, not a scalar: on a warped hull it varies bow to stern, and
    the governing station is not known in advance.
  bounds:
    min: 0.0
    min_exclusive: true
    max: 60.0
  bounds_basis: mathematical
  bounds_rationale: >-
    Divided into by cfr-25.533-b2-flared-chine-pressure and
    cfr-25.533-c1-distributed-pressure, and raised to the 2/3 power in the
    denominator of cfr-25.527-a1. Zero is singular in all three.
  used_by:
    - cfr-25.527-a1
    - cfr-25.527-a2
    - cfr-25.529-b1-unsymmetrical-side-component
    - cfr-25.533-b2-flared-chine-pressure
    - cfr-25.533-c1-distributed-pressure
  distinct_from:
    - geometry.hull.deadrise_keel_deg
  notes: >-
    Deadrise pulls in opposite directions across the corpus. Raising it lowers
    the vertical water reaction of cfr-25.527-a1 and lowers the bottom
    pressures, but RAISES the unsymmetrical side load of
    cfr-25.529-b1-unsymmetrical-side-component, which goes as tan(beta). It
    cannot be selected against the vertical case alone.

- name: geometry.hull.deadrise_step_deg
  title: Angle of dead rise at the main step
  symbol: beta
  units: degrees
  description: >-
    Deadrise at the main step. Named separately because § 25.531 specifies this
    station and no other for the takeoff condition.
  bounds:
    min: 0.0
    min_exclusive: true
    max: 60.0
  bounds_basis: mathematical
  bounds_rationale: Denominator of cfr-25.531-b-takeoff-inertia-load-factor.
  used_by:
    - cfr-25.531-b-takeoff-inertia-load-factor
  distinct_from:
    - geometry.hull.deadrise_station_deg
    - geometry.hull.deadrise_keel_deg

- name: geometry.float.deadrise_three_quarter_deg
  title: Auxiliary float dead rise at three-quarters bow-to-step
  symbol: beta_S
  units: degrees
  description: >-
    Deadrise of an AUXILIARY float at a station three-quarters of the distance
    from its bow to its step. A property of the float, not of the hull.
  bounds:
    min: 15.0
  bounds_basis: regulatory
  bounds_rationale: >-
    cfr-25.535-b-deadrise-floor — "need not be less than 15 degrees". This is
    relief, not a geometric limit: a float may physically have less. The bound
    constrains the value USED IN THE FORMULA, not the shape the designer may
    draw, and a consumer that rejects an 8 degree float has misread it.
  used_by:
    - cfr-25.535-b-step-load
    - cfr-25.535-b-deadrise-floor
  distinct_from:
    - geometry.hull.deadrise_station_deg
  notes: >-
    The regulation's own guard against the tan(beta) singularity — and the only
    one in Subpart C. The hull pressure formulas have no equivalent protection,
    which is why the hull deadrise bounds above are mathematical rather than
    regulatory.

# ---------------------------------------------------------------------------
# Hull stations
# ---------------------------------------------------------------------------

- name: geometry.hull.forebody_length
  title: Forebody length, bow to main step
  symbol: L_f
  units: length
  description: >-
    Distance from the bow to the main step, measured parallel to the hull
    reference axis. DEFINITIONALLY the step station: Appendix B figure 2 places
    x = L_f at the main step, and the K1/K2 discontinuity is located there.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: Denominator of the forebody branch of cfr-25-appB-fig2-k1 and -k2.
  used_by:
    - cfr-25-appB-fig2-k1
    - cfr-25-appB-fig2-k2
  distinct_from:
    - geometry.hull.spray_forebody_length
  notes: >-
    THE CONFLATION TO WATCH. Two consumers carry a "forebody fraction" that is
    permitted to differ from their "step fraction". For Appendix B purposes the
    two cannot differ — the forebody ends at the step by definition. Where a
    separate forebody length exists it is a hydrodynamic spray quantity, and
    substituting it into K1 or K2 moves the step discontinuity to a station the
    hull does not have.

- name: geometry.hull.afterbody_length
  title: Afterbody length, main step to stern
  symbol: L_a
  units: length
  description: Distance from the main step to the stern post.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: Denominator of the afterbody branch of cfr-25-appB-fig2-k1 and -k2.
  used_by:
    - cfr-25-appB-fig2-k1
    - cfr-25-appB-fig2-k2

- name: geometry.hull.spray_forebody_length
  title: Hydrodynamic spray forebody length
  units: length
  description: >-
    Forebody length as used by spray and planing correlations, which need not
    coincide with the regulatory step station.
  bounds_basis: conceptual
  used_by:
    - cfr-25-appB-fig2-k1
  distinct_from:
    - geometry.hull.forebody_length
  notes: >-
    Declared here ONLY so that the distinction is nameable and the conflation
    is checkable. No constraint in this corpus consumes it; the used_by entry
    above records what it is wrongly substituted into, not what it feeds.

- name: geometry.hull.chine_flare_deg
  title: Chine flare angle
  units: degrees
  description: >-
    Outward flare of the chine relative to the bottom. Its value SELECTS a
    regulatory path rather than merely scaling a result.
  bounds:
    min: 0.0
  bounds_basis: mathematical
  bounds_rationale: Negative flare is not a defined geometry in Appendix B figure 1.
  used_by:
    - cfr-25.533-b1-chine-ratio
    - cfr-25.533-b2-flared-chine-pressure
  notes: >-
    Zero flare selects the unflared path, where chine pressure is exactly
    0.75 x P_k. Non-zero selects cfr-25.533-b2-flared-chine-pressure, which is
    a different formula taking the station deadrise instead of the keel
    deadrise. A consumer that carries flare but only ever evaluates the
    unflared path is not wrong about the number so much as unable to reach half
    the section.

# ---------------------------------------------------------------------------
# Weights — three different W's
# ---------------------------------------------------------------------------

- name: weights.design_landing_weight_lb
  title: Seaplane design landing weight
  symbol: W
  units: lb
  description: Design landing weight, as used by the water reaction load factors.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: Raised to the 1/3 and 2/3 powers in denominators; zero is undefined.
  used_by:
    - cfr-25.527-a1
    - cfr-25.527-a2
    - cfr-25.535-b-step-load
  distinct_from:
    - weights.design_water_takeoff_weight_lb
    - weights.design_max_takeoff_weight_lb
    - weights.maximum_weight_lb
  notes: >-
    cfr-25.523-a-design-weights requires the water load conditions to be met at
    EACH operating weight up to this one, not only at this one. A single-point
    evaluation does not satisfy the section — and the heaviest case is not
    automatically critical, because the load factor falls as W^(-1/3) while the
    load rises with W.

- name: weights.design_water_takeoff_weight_lb
  title: Design water takeoff weight
  symbol: W
  units: lb
  description: >-
    Maximum weight for water taxi and takeoff run. The § 25.531 takeoff
    condition uses this weight and no other.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: Raised to the 1/3 power in a denominator.
  used_by:
    - cfr-25.531-b-takeoff-inertia-load-factor
    - cfr-25.523-a-design-weights
  distinct_from:
    - weights.design_landing_weight_lb
  notes: >-
    The corpus symbol W means different weights in different entries. That is
    the regulation's doing, not an encoding artifact, and it is the strongest
    single argument for a named vocabulary sitting alongside the symbols.

- name: weights.design_max_takeoff_weight_lb
  title: Design maximum takeoff weight
  symbol: W
  units: lb
  description: Design maximum takeoff weight, as used by the flight load factor.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: >-
    Appears as 24000/(W + 10000); the expression is only meaningful for
    positive W, and cfr-25.337-b-positive-limit-maneuvering is dimensional in
    pounds.
  used_by:
    - cfr-25.337-b-positive-limit-maneuvering
  distinct_from:
    - weights.design_landing_weight_lb
    - weights.design_water_takeoff_weight_lb

- name: weights.maximum_weight_lb
  title: Maximum weight of the seaplane or amphibian
  symbol: W_max
  units: lb
  description: >-
    Maximum weight, as used by the main float buoyancy margin. § 25.751(a) says
    "maximum weight" and not "maximum design landing weight"; secondary sources
    routinely substitute the latter.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: Divided into by interp-25.751-required-float-volume.
  used_by:
    - cfr-25.751-a-main-float-buoyancy
    - interp-25.751-required-float-volume
  distinct_from:
    - weights.design_landing_weight_lb

# ---------------------------------------------------------------------------
# Speeds — V_S0 and V_S1 are not interchangeable
# ---------------------------------------------------------------------------

- name: speeds.stall_landing_flaps_kt
  title: Stalling speed, landing flaps, no slipstream
  symbol: V_S0
  units: knots
  description: >-
    Seaplane stalling speed with flaps extended in the appropriate LANDING
    position and with no slipstream effect.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  used_by:
    - cfr-25.527-a1
    - cfr-25.527-a2
    - cfr-25.533-c1-distributed-pressure
    - cfr-25.535-b-step-load
  distinct_from:
    - speeds.stall_takeoff_flaps_kt
  notes: >-
    § 25.533 uses BOTH speeds in adjacent paragraphs: the local pressures of
    (b) take V_S1, the distributed pressures of (c) take V_S0. Substituting one
    for the other changes the result by the square of the speed ratio. This is
    the detail a summarizer drops, and it is why the two are separate names
    here rather than one `stall_speed` with a comment.

- name: speeds.stall_takeoff_flaps_kt
  title: Stalling speed at design water takeoff weight, takeoff flaps
  symbol: V_S1
  units: knots
  description: >-
    Seaplane stalling speed at the design water takeoff weight with flaps
    extended in the appropriate TAKEOFF position.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  used_by:
    - cfr-25.533-b1-keel-pressure
    - cfr-25.533-b2-flared-chine-pressure
    - cfr-25.531-b-takeoff-inertia-load-factor
  distinct_from:
    - speeds.stall_landing_flaps_kt

- name: speeds.design_cruising_keas
  title: Design cruising speed VC
  symbol: V_C
  units: KEAS
  description: Design cruising speed, the upper limit of the constant negative load factor.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  used_by:
    - cfr-25.337-c1-negative-limit-to-vc
    - cfr-25.337-c2-negative-varies-to-vd

- name: speeds.design_dive_keas
  title: Design dive speed VD
  symbol: V_D
  units: KEAS
  description: >-
    Design dive speed, at which the negative limit maneuvering load factor
    reaches zero.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: >-
    cfr-25.337-c2-negative-varies-to-vd divides by (V_D - V_C), so the two
    speeds must also be distinct — a consumer supplying V_D == V_C gets a
    division by zero, not a degenerate but valid answer.
  used_by:
    - cfr-25.337-c2-negative-varies-to-vd

# ---------------------------------------------------------------------------
# Inertia ratios
# ---------------------------------------------------------------------------

- name: inertia.pitch_gyration_ratio
  title: Station-to-CG distance over pitch radius of gyration
  symbol: r_x
  units: dimensionless
  description: >-
    Ratio of the distance, measured parallel to the hull reference axis, from
    the CG to the hull longitudinal station being computed, to the pitch radius
    of gyration.
  bounds:
    min: 0.0
  bounds_basis: mathematical
  used_by:
    - cfr-25.527-a2
  distinct_from:
    - inertia.roll_gyration_ratio
  notes: >-
    Measured from the CG, so cfr-25.523-b-critical-cg makes this a swept
    quantity: moving the CG within the certified envelope changes it at every
    station.

- name: inertia.roll_gyration_ratio
  title: Float lateral offset over roll radius of gyration
  symbol: r_y
  units: dimensionless
  description: >-
    Ratio of the lateral distance between the center of gravity and the plane
    of symmetry of the AUXILIARY FLOAT, to the radius of gyration in roll.
  bounds:
    min: 0.0
  bounds_basis: mathematical
  used_by:
    - cfr-25.535-b-step-load
  distinct_from:
    - inertia.pitch_gyration_ratio
  notes: >-
    The lateral analogue of r_x, and a plausible thing to substitute r_x into.
    Both appear as (1 + r^2)^(2/3) in their respective denominators, so the
    substitution produces a believable number rather than an obvious error.
