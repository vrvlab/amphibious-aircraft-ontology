# Hull profile — the keel around the main step, seen in the plane of symmetry.
#
# The lines of a hull are drawn on a base line, and the regulation measures on
# the hull reference axis, the tangent to the keel at the main step (14 CFR
# 25.527(b)(7)). Where the forebody ends in a run, a stretch of identical
# sections, the keel there is straight and the two lines can be one: the
# Langley series tabulate the forebody keel at 0 degrees to their base line.
# The angles below are all measured from that keel at the step.
#
# Definitions only. The values are a design's: no typical value is recorded.

- id: forebody-run-length
  name: Forebody run length, run's forward end to main step
  aliases: [forebody run, run, straight portion of the forebody keel, run length]
  quantity:
    unit: unit:M
    symbol: m
    quantity_kind: quantitykind:Length
  definition: >-
    The length of the forebody run: the consecutive stations immediately
    forward of the main step whose sections are identical to the section at the
    step, keel to crown, the step's own station among them. Along the run the
    hull neither rises nor narrows, so its keel is straight and meets the step
    level.
  measurement_convention:
    datum: >-
      From the forward end of the run: the most forward station from which every
      station aft to the main step has the section at the step.
    station: >-
      To the main step. The section at the step is the forebody's, the step's
      lower edge.
    source: >-
      The term is the ontology's. NACA TN 551, p. 2, calls the run's keel "the
      straight portion of the forebody keel".
    line: >-
      Parallel to the hull reference axis of 14 CFR 25.527(b)(7), the tangent
      to the keel at the main step. Where the run has length its keel is
      straight, so the axis lies along it and the length is taken along the
      run's own keel.
    notes: >-
      Zero where no station forward of the step repeats the section at the
      step: the hull has no run. The whole section repeats, not the bottom
      alone. A hull whose bottom repeats while its sides or deck taper has a
      straight keel ahead of the step and no run by this definition; that
      straight length is a different quantity and has no entry. Where a run has
      length, the base line a hull's lines are drawn on can be laid along it, as
      the Langley series lay theirs: NACA TN 1648, Table I, and TN 3119, Table
      II, tabulate the "angle of forebody keel" to the base line as 0.
  bounds:
    min: 0.0
  bounds_basis: mathematical
  bounds_rationale: >-
    A length, and zero for a hull with no run.
  distinct_from: [forebody-length]
  verification:
    status: defined
    checked_against: >-
      The bounded search (docs/CONOPS.md), 2026-09-26, reading NTRS scans as
      page images: NACA TN 551 (Dawson, January 1936), citation 19930081350,
      PDF sha256 fb0b4ef5a7f3...3804, p. 2; NACA TN 1648 (Haar, July 1948),
      citation 19930082265, sha256 9ef1af39f8dd...72c8, Table I, p. 13; NACA TN
      3119 (Carter and Woodward, January 1954), citation 19930083895, sha256
      9a0bb3ea2231...b239, Table II, p. 11. None names the run or gives a rule
      for its extent; TN 551's offsets tables show a keel constant over the
      stations ahead of the step without saying so in words.
    rationale: >-
      A design tool draws a hull's lines on one horizontal reference and needs a
      word for the stretch ahead of the step that makes that reference the
      regulation's axis. A run of identical sections does: it is a parallel body
      that ends at the step, which a tool can declare and hold exactly, and
      along it the tangent to the keel at the step is the keel itself. The whole
      section, and not the bottom alone, was chosen by the designer,
      2026-09-26: a run is a stretch where nothing of the hull changes. Read by
      a design tool that declares the run, and by any comparison of forebodies
      that separates the run from the entry forward of it.
  tags: [hull, geometry, hydrodynamics]

- id: afterbody-keel-angle
  name: Afterbody keel angle, between the keels at the main step
  aliases: [afterbody angle, angle of afterbody keel, afterbody keel to forebody keel angle]
  quantity:
    unit: unit:DEG
    symbol: deg
    quantity_kind: quantitykind:Angle
  definition: >-
    The angle, in the plane of symmetry, between the forebody keel and the
    afterbody keel at the main step, positive with the afterbody keel rising
    aft.
  measurement_convention:
    datum: >-
      The tangent to the forebody keel at the main step: the hull reference axis
      of 14 CFR 25.527(b)(7).
    station: >-
      At the main step. The afterbody keel is taken as its tangent at the step,
      from aft of it; where it is straight, as on the hulls the sources draw, the
      keel itself.
    source: >-
      NACA ARR 4F15, Figure 6: "angle between forebody and afterbody keels".
      NACA TN 1648, Table I, and TN 3119, Table II: "angle of afterbody keel" to
      a base line at 0 degrees to the forebody keel.
    notes: >-
      Not the sternpost angle, which is taken to a line from the step to the
      sternpost and includes the step's depth: TN 1648 and TN 3119 tabulate the
      two in separate rows, with different values. A value tabulated against a
      base line is this angle only where the forebody keel is at 0 degrees to
      that base line, as it is in TN 1648 and TN 3119.
  distinct_from: [sternpost-angle]
  verification:
    status: defined
    checked_against: >-
      Read from the NTRS scans as page images, 2026-09-26: NACA ARR 4F15
      (Davidson and Locke, June 1944), citation 19930093044, PDF sha256
      fdbb07cd2b81...a8f5, Figure 6 (PDF p. 32); NACA TN 1648, citation
      19930082265, sha256 9ef1af39f8dd...72c8, Table I, p. 13; NACA TN 3119,
      citation 19930083895, sha256 9a0bb3ea2231...b239, Table II, p. 11.
    rationale: >-
      The sources agree that the angle is between the two keels, and draw both
      keels straight near the step. The tangent at the step, for an afterbody
      keel that curves, is the ontology's, so that the angle is defined for any
      hull a tool can draw. Read by a design tool's profile of the hull, and by
      any afterbody clearance or trim limit expressed in it.
  tags: [hull, geometry, hydrodynamics]

- id: sternpost-angle
  name: Sternpost angle, forebody keel to the line from step to sternpost
  aliases: [angle of sternpost, sternpost angle to base line]
  quantity:
    unit: unit:DEG
    symbol: deg
    quantity_kind: quantitykind:Angle
  definition: >-
    The angle, in the plane of symmetry, between the tangent to the forebody
    keel at the main step and the straight line joining the tip of the main step
    with the tip of the sternpost, positive with the line rising aft.
  measurement_convention:
    datum: >-
      The tangent to the forebody keel at the main step: the hull reference axis
      of 14 CFR 25.527(b)(7).
    station: >-
      From the tip of the main step, read here as the forebody keel at the step,
      the step's lower edge; to the tip of the sternpost, the aft end of the
      afterbody keel.
    source: >-
      NACA ARR 4F15, Figure 6: "angle between tangent to forebody keel at main
      step and a line joining tip of main step with tip of sternpost".
    notes: >-
      Not the afterbody keel angle. The line to the sternpost starts at the
      forebody keel, below the afterbody keel by the step's depth, so the
      sternpost angle exceeds the afterbody keel angle for any step with depth:
      NACA TN 1648, Table I, and TN 3119, Table II, tabulate both, and in every
      column the sternpost angle is the greater. A READING: "tip of main step"
      is not defined in the figure; the step's lower edge is the point on the
      forebody keel, where the tangent that is the datum is taken.
  distinct_from: [afterbody-keel-angle]
  verification:
    status: defined
    checked_against: >-
      Read from the NTRS scans as page images, 2026-09-26: NACA ARR 4F15,
      citation 19930093044, PDF sha256 fdbb07cd2b81...a8f5, Figure 6 (PDF p. 32),
      whose note states the definition; NACA TN 1648, citation 19930082265,
      sha256 9ef1af39f8dd...72c8, Table I, p. 13; NACA TN 3119, citation
      19930083895, sha256 9a0bb3ea2231...b239, Table II, p. 11.
    rationale: >-
      ARR 4F15 states the definition; the entry is defined, not verified, only
      because it reads "tip of main step" as the step's lower edge, which the
      figure does not say. Read by a design tool's profile of the hull, and by
      any limit on the trim at which the afterbody meets the water.
  tags: [hull, geometry, hydrodynamics]
