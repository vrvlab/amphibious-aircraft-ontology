# Hull length and beam: the two dimensions every hull coefficient is made from.
#
# 14 CFR Part 25 defines neither. Sections 25.521-25.537 use a bow-to-step and a
# step-to-sternpost length and nothing else, and Appendix B's figures carry no
# beam at all. The definitions come from the NACA tank-test reports, which fixed
# them to reduce model results to coefficients, and which do not agree on beam.
#
# The disagreement is the reason for three entries rather than two. Stevens
# Institute reduced its tests with the beam AT THE MAIN STEP; Langley reduced its
# with the MAXIMUM beam. Both write the load coefficient as C_delta = delta/(w b^3),
# so a coefficient read from one series and applied with the other's beam is off
# by the cube of their ratio, and nothing in the symbol says which b it was.
#
# Draft is here because the flying-boat literature defines it the same way every
# time: vertically, from the keel, at the main step. It is not one number but a
# function of load, and the entry says so.
#
# Hull depth, waterline length, and the prismatic and block coefficients are not
# here. The only definitions found are ITTC's, written for ships, whose default
# stations (between perpendiculars, amidships, the design waterline) a stepped
# hull does not obviously have. See docs/verification-log.md, Rounds 13 and 15.

- id: hull-length
  name: Hull length, forepoint to sternpost
  aliases:
    - hull length
    - length to sternpost
    - length of hydrodynamic surfaces
    - hull_length
  quantity:
    unit: unit:M
    symbol: m
    quantity_kind: quantitykind:Length
  definition: >-
    The length of the hull from its forepoint to its sternpost: the length of
    the hydrodynamic surfaces. Excludes any tail extension or fairing aft of the
    sternpost.
  measurement_convention:
    datum: >-
      From the forepoint, the forward end of the hull. NACA TN 1570 names the
      same point the forward perpendicular (F.P.).
    station: >-
      To the sternpost (S.P.), the aft end of the afterbody planing bottom.
      NOT the over-all length. ARR L5G23 Table I tabulates the two as separate
      rows, and for its NACA series they differ by the tail extension: 114.85
      against 83.33 inches for model 144.
    source: >-
      NACA ARR 4F15, p. 11 (symbol L) and Table I, p. 26; NACA TN 1570, p. 3
      (symbol L); NACA ARR L5G23, Table I, p. 11.
    line: >-
      DEFINED HERE: measured parallel to the hull's base line, the reference
      line its stations are measured along. Not along the keel, and not
      horizontally at rest.
    notes: >-
      None of the three reports says along which line the length is measured:
      along the keel, along the hull reference axis, or horizontally. On a hull
      with a rising afterbody keel the three differ. ARR 4F15 Figure 7 draws two
      candidates 2 degrees apart, the keel tangent at the step and a base line,
      with stations in inches aft of F.P. The line is therefore the ontology's
      choice; see verification.rationale.
      A READING, NOT A SOURCE'S TEXT: 14 CFR 25.529(a) measures the bow landing
      station from the bow to the step and the stern landing station from the
      step to the sternpost, so forebody-length plus afterbody-length spans
      this length. The regulation never states the sum.
      The length-beam ratio in every report read is this length over a beam,
      and which beam depends on the report; see beam-at-main-step.
      NOT Locke's L. NACA ARR (Locke, March 1943) forms its over-all length
      coefficient L/b by adding its forebody and afterbody equations (p. 5),
      and ends the afterbody at "the second step or stern post, whichever is
      shorter" (p. 3). On a hull with a second step that is shorter than this
      length, and the report never defines L on its own.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: >-
    Every quantity stated as a fraction of hull length divides by it.
  distinct_from: [forebody-length, afterbody-length]
  verification:
    status: defined
    checked_against: >-
      Read from the NTRS scans, page images and not only the text layer: NACA
      ARR 4F15 (Davidson and Locke, June 1944), citation 19930093044, PDF sha256
      fdbb07cd2b81...a8f5, pp. 11 and 26 and Figure 7; NACA TN 1570 (Carter and
      Haar, April 1948), citation 19930082382, sha256 2a1555ccebf7...957f, p. 3;
      NACA ARR L5G23 (Land, Bidwell and Goldenbaum, October 1945), citation
      19930093020, sha256 c3cb5500945f...1db8, Table I, p. 11; NACA ARR (Locke,
      March 1943), citation 19930093017. All fetched 2026-09-23. The bounded
      search for the measuring line (docs/CONOPS.md) ended with these: none
      states it.
    rationale: >-
      The base line is the axis a hull's stations are measured along, so
      forebody-length and afterbody-length, which run bow to step and step to
      sternpost, add to this length exactly when all three are taken along it.
      It is a property of the hull's lines alone. The keel is not straight
      (the step, a rising afterbody) and would need a further rule, and a
      horizontal length at rest would depend on load and trim, as draft does.
      Read by every length-beam ratio. Chosen by the designer, 2026-09-23.
    notes: >-
      The endpoints are the sources': the reports read agree on forepoint (or
      F.P.) to sternpost, and ARR L5G23 applies it across the DVL, NACA and
      Stevens series alike. The line is the ontology's. A value from a report
      measured along another line differs by the cosine of the angle between
      them: 0.06 percent at ARR 4F15's 2 degrees.
  tags: [hull, geometry, hydrodynamics]

- id: beam-at-main-step
  name: Hull beam at the main step
  aliases: [step beam, beam at main step, beam at the step]
  quantity:
    unit: unit:M
    symbol: m
    quantity_kind: quantitykind:Length
  definition: >-
    The beam of the hull at the main step. The characteristic dimension of the
    Stevens Institute tank series: every coefficient in NACA ARR 4F15 divides by
    it.
  measurement_convention:
    datum: >-
      Transverse, in the section at the main step, over the chines, excluding
      spray strips. The source does not say what the beam is taken over; the
      over-chines convention is DEFINED HERE, as for maximum-beam.
    station: At the main step.
    source: >-
      NACA ARR 4F15, p. 11: "b beam at main step, feet", in the definitions of
      C_delta = delta/(w b^3), C_V = V/sqrt(g b), C_R = R/(w b^3),
      C_M = M/(w b^4), C_d = d/b and the length/beam ratio L/b. Table I, p. 26,
      tabulates "Beam at main step". NACA Report 766, p. 7, also states step
      depth as a percentage "of the beam at the step". NACA ARR (Locke, March
      1943), p. 3, uses the same b, "beam at the main step", and calls it the
      fundamental length characteristic of a seaplane hull.
    notes: >-
      Where a hull's chine planform is widest at the step, this equals
      maximum-beam. ARR L5G23 Table I files the Stevens series' 5.40 inches
      under "Maximum beam", which is right only if those hulls are widest at
      the step; no source read says they are.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: >-
    Denominator of every Stevens-series coefficient, as b^3 in the load and
    resistance coefficients.
  distinct_from: [maximum-beam]
  verification:
    status: defined
    checked_against: >-
      NACA ARR 4F15 (June 1944), NTRS citation 19930093044, PDF sha256
      fdbb07cd2b81...a8f5, pp. 11 and 26 read from the page images; NACA Report
      766 (1943), citation 19930091845, sha256 bfd856295b36...4598, p. 7; NACA
      ARR (Locke, March 1943), citation 19930093017, sha256 dc018c4e78ca...b71b,
      p. 3. All fetched 2026-09-23. None of them says what the beam is taken
      over; the bounded search ended there.
    rationale: >-
      Over the chines, excluding spray strips, agrees with ITTC's maximum
      breadth over chines for a hard-chine planing hull, B_PX (see
      maximum-beam), and makes this beam and maximum-beam comparable wherever
      a hull is widest at the step. The chine is the line the planing bottom
      ends at, which is what the load and resistance coefficients scale by.
      Read by every Stevens-series coefficient and every length-beam ratio.
      Chosen by the designer, 2026-09-23.
    notes: >-
      The station and the name are the sources'; what the beam is taken over
      is the ontology's.
  tags: [hull, geometry, hydrodynamics]

- id: maximum-beam
  name: Hull maximum beam
  aliases: [max beam, maximum hull beam, hull beam, hull_beam]
  quantity:
    unit: unit:M
    symbol: m
    quantity_kind: quantitykind:Length
  definition: >-
    The greatest beam of the hull, wherever along it that occurs. The
    characteristic dimension of the Langley tank tests: NACA Report 766 says the
    maximum beam "was chosen as the characteristic dimension".
  measurement_convention:
    datum: >-
      Transverse, over the chines, excluding spray strips: DEFINED HERE. The
      NACA sources do not say whether the beam is taken over the chines, over
      spray strips, or over the flare. ITTC, for a hard-chine planing hull,
      defines a maximum breadth over chines, B_PX, "excluding external spray
      strips", and this entry agrees with it; whether Langley measured the same
      way is not stated.
    station: >-
      The station of greatest beam, which need not be the step. On Report 766's
      model 84 it is station 10, "maximum beam", while step depth is stated
      against the beam at the step.
    source: >-
      NACA Report 766, p. 9: "b maximum beam, feet", in C_delta = delta/(w b^3)
      and the other coefficients; p. 7 for station 10. NACA TN 1570, p. 3:
      "b maximum beam of hull, feet". ITTC Symbols and Terminology List,
      Version 2024, section 3.1.1, for B_PX.
    notes: >-
      Bare "beam" is not an alias of this entry or of beam-at-main-step. It is
      used for both, and a tool that writes it has not said which.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: >-
    Denominator of every Langley-series coefficient, as b^3 in the load and
    resistance coefficients.
  distinct_from: [beam-at-main-step]
  verification:
    status: defined
    checked_against: >-
      NACA Report 766 (Parkinson, Olson, Draley and Luoma, 1943), NTRS citation
      19930091845, PDF sha256 bfd856295b36...4598, pp. 7 and 9; NACA TN 1570
      (April 1948), citation 19930082382, sha256 2a1555ccebf7...957f, p. 3;
      ITTC Symbols and Terminology List, Version 2024, PDF sha256
      5eb1eb88af50...77ee, section 3.1.1. All read from the page images or the
      publisher's PDF, fetched 2026-09-23.
    rationale: >-
      The Langley definition gives the station; what the beam is taken over it
      leaves open. Over the chines, excluding spray strips, is the convention
      of ITTC's B_PX, the one public standard read that states one for a
      hard-chine planing hull, and the same one beam-at-main-step uses, so the
      two beams differ only in station. Read by every Langley-series
      coefficient. Chosen by the designer, 2026-09-23.
    notes: >-
      The station is Langley's; the convention is the ontology's and agrees
      with ITTC's. A Langley value is not thereby claimed to have been measured
      over the chines.
  tags: [hull, geometry, hydrodynamics]

- id: draft-at-main-step
  name: Hull draft at the main step
  aliases: [step draft, draft at step, draft of keel at main step, t_st]
  quantity:
    unit: unit:M
    symbol: m
    quantity_kind: quantitykind:Length
  definition: >-
    The vertical distance from the bottom of the keel at the main step down to
    the water line: how deep the hull sits at the step. Not a property of the
    hull alone. It depends on the load on the water, so a value means nothing
    without the load it was taken at.
  measurement_convention:
    datum: >-
      The bottom of the keel at the main step. Sottorf: the "vertical distance
      of the water line from the bottom of the keel at the step".
    station: At the main step.
    source: >-
      NACA TM 860 (Sottorf, April 1938), notation on the first page, symbol t_st; NACA ARR 4F15,
      p. 11, "d draft of keel at main step", with C_d = d/b, and Figure 4,
      "Static properties of the four models", which plots C_d against the load
      coefficient; NACA Report 766, p. 9, "d draft at main step", with C_d =
      d/b.
    notes: >-
      Vertical, not normal to the keel or to the hull reference axis. Sottorf
      says so; the NACA reports do not repeat it.
      A value must carry its load. ARR 4F15 Figure 4 gives draft as a curve
      against C_delta, at rest, so a draft without the load and the at-rest
      condition is not reproducible. Underway, the draft at the step changes
      with speed and trim, and none of these definitions covers that case.
      Nondimensionalised as d/b, and which b is the report's: the beam at the
      main step in ARR 4F15, the maximum beam in Report 766. See
      beam-at-main-step and maximum-beam.
      This is the only flying-boat draft definition found. A block coefficient
      for a flying boat would need one; no source read builds a block
      coefficient from it.
  verification:
    status: verified
    checked_against: >-
      Read from the NTRS scans' page images: NACA TM 860, W. Sottorf, "The
      Design of Floats" (April 1938, translated from Luftfahrtforschung vol. 14,
      1937), citation 19930094556, PDF sha256 48819b668eac...52f7, notation on
      the first page; NACA
      ARR 4F15 (June 1944), citation 19930093044, sha256 fdbb07cd2b81...a8f5,
      p. 11 and Figure 4; NACA Report 766 (1943), citation 19930091845, sha256
      bfd856295b36...4598, p. 9. All fetched 2026-09-23.
    notes: >-
      Sottorf's TM is an NACA translation of a German original, and defines the
      quantity for a float. The station and datum are the same as for a
      flying-boat hull, and the NACA hull reports use the same symbol-level
      definition.
  tags: [hull, geometry, hydrodynamics, hydrostatics]
