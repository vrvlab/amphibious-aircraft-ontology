# Weights and speeds — the parameters where ONE regulatory symbol means several
# different quantities.
#
# Deadrise is one quantity under several names. This is the mirror image: the
# symbol W appears in four constraints and means a different weight in each,
# and V_S0 and V_S1 sit in adjacent paragraphs of § 25.533 meaning different
# stalling speeds. Nothing in the symbol tells you which. That is not a defect
# in the encoding, it is what the regulation does, and it is the strongest
# single argument for a named vocabulary sitting alongside the symbols.

# ---------------------------------------------------------------------------
# Weights
# ---------------------------------------------------------------------------

- id: design-landing-weight
  name: Seaplane design landing weight
  aliases: [design landing weight, W]
  quantity:
    unit: unit:LB_F
    symbol: lbf
    quantity_kind: quantitykind:Force
  definition: >-
    The weight the water reaction load factors are referred to. A
    manufacturer's declared design value, not a derived one.
  measurement_convention:
    datum: Weight of the seaplane, fresh water condition assumed throughout Subpart C.
    station: n/a
    source: 14 CFR 25.527(b)(5), 25.523(a)
    notes: >-
      25.523(a) requires the water load conditions to be met at EACH operating
      weight up to this one, not only at this one. A single-point evaluation
      does not satisfy the section, and the heaviest case is not automatically
      critical: the load factor falls as W^(-1/3) while the load itself rises
      with W, so the product can peak below the maximum.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: Raised to the 1/3 and 2/3 powers in denominators; zero is undefined.
  regulatory_mapping:
    - constraint: cfr-25.527-a1
      symbol: W
      relationship: identical
    - constraint: cfr-25.527-a2
      symbol: W
      relationship: identical
    - constraint: cfr-25.535-b-step-load
      symbol: W
      relationship: identical
    - constraint: cfr-25.523-a-design-weights
      symbol: W
      relationship: subset
      caveats: >-
        25.523(a) makes this an upper limit on a swept range rather than a
        single evaluation point. A tool that binds W once has evaluated one
        point of the condition the section states.
  distinct_from: [design-water-takeoff-weight, design-max-takeoff-weight, maximum-weight]
  verification:
    status: verified
    checked_against: 14 CFR 25.527(b)(5) and 25.523(a) full text, eCFR issue 2026-07-07.
  tags: [weights, part-25, water-loads]

- id: design-water-takeoff-weight
  name: Design water takeoff weight
  aliases: [design water takeoff weight, maximum water taxi weight]
  quantity:
    unit: unit:LB_F
    symbol: lbf
    quantity_kind: quantitykind:Force
  definition: >-
    The maximum weight for water taxi and takeoff run. Distinct from the design
    landing weight, and generally higher: an amphibian takes off heavy and lands
    light.
  measurement_convention:
    datum: Weight of the seaplane.
    station: n/a
    source: 14 CFR 25.523(a), 25.531(b)
    notes: >-
      The § 25.531 takeoff condition uses this weight and no other. It is the
      one stated exception to 25.523(a)'s design landing weight rule.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: Raised to the 1/3 power in a denominator.
  regulatory_mapping:
    - constraint: cfr-25.531-b-takeoff-inertia-load-factor
      symbol: W
      relationship: identical
    - constraint: cfr-25.523-a-design-weights
      symbol: W
      relationship: identical
  distinct_from: [design-landing-weight, design-max-takeoff-weight, maximum-weight]
  verification:
    status: verified
    checked_against: 14 CFR 25.523(a) and 25.531(b) full text, eCFR issue 2026-07-07.
  tags: [weights, part-25, water-loads, takeoff]

- id: design-max-takeoff-weight
  name: Design maximum takeoff weight
  aliases: [MTOW, design maximum takeoff weight]
  quantity:
    unit: unit:LB_F
    symbol: lbf
    quantity_kind: quantitykind:Force
  definition: >-
    The design maximum takeoff weight, as used by the flight manoeuvre load
    factor. An airframe-level weight, not a water-specific one.
  measurement_convention:
    datum: Weight of the airplane.
    station: n/a
    source: 14 CFR 25.337(b)
    notes: >-
      25.337(b) names this weight explicitly, which is unusual — most of
      Subpart C leaves the weight to the surrounding section.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: >-
    Appears as 24,000/(W + 10,000). The constants are dimensional, so the
    expression is valid only with W in pounds — an interpretation recorded in
    cfr-25.337-b-positive-limit-maneuvering, since the section states no units.
  regulatory_mapping:
    - constraint: cfr-25.337-b-positive-limit-maneuvering
      symbol: W
      relationship: identical
  distinct_from: [design-landing-weight, design-water-takeoff-weight, maximum-weight]
  verification:
    status: verified
    checked_against: 14 CFR 25.337(b) full text, eCFR issue 2026-07-07.
  tags: [weights, part-25, flight-loads]

- id: maximum-weight
  name: Maximum weight of the seaplane or amphibian
  aliases: [maximum weight, W_max]
  quantity:
    unit: unit:LB_F
    symbol: lbf
    quantity_kind: quantitykind:Force
  definition: >-
    The maximum weight, as used by the main float buoyancy margin of
    § 25.751(a).
  measurement_convention:
    datum: Weight of the seaplane or amphibian.
    station: n/a
    source: 14 CFR 25.751(a)
    notes: >-
      The section says "maximum weight", NOT "maximum design landing weight".
      Secondary sources routinely substitute the latter, which understates the
      required float buoyancy.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: Divided into by interp-25.751-required-float-volume.
  regulatory_mapping:
    - constraint: cfr-25.751-a-main-float-buoyancy
      symbol: W_max
      relationship: identical
    - constraint: interp-25.751-required-float-volume
      symbol: W_max
      relationship: identical
  distinct_from: [design-landing-weight, design-water-takeoff-weight, design-max-takeoff-weight]
  verification:
    status: verified
    checked_against: 14 CFR 25.751(a) full text, eCFR issue 2026-07-07.
  tags: [weights, part-25, buoyancy]

# ---------------------------------------------------------------------------
# Speeds
# ---------------------------------------------------------------------------

- id: stall-speed-landing-flaps
  name: Stalling speed, landing flaps, no slipstream
  aliases: [V_S0, VS0, landing stall speed]
  quantity:
    unit: unit:KN
    symbol: kn
    quantity_kind: quantitykind:Speed
  definition: >-
    Seaplane stalling speed with flaps extended in the appropriate LANDING
    position and with no slipstream effect.
  measurement_convention:
    datum: >-
      No slipstream effect — power off. The regulation says so explicitly, and
      it matters for a high-wing flying boat with propellers well above the
      wing.
    station: n/a
    source: 14 CFR 25.527(b)(3), 25.533(c)(1), 25.535(b)
    notes: >-
      § 25.533 uses BOTH stalling speeds in adjacent paragraphs: the local
      pressures of (b) take V_S1, the distributed pressures of (c) take V_S0.
      Substituting one for the other changes the result by the square of the
      speed ratio. This is the detail a summarizer drops.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  regulatory_mapping:
    - constraint: cfr-25.527-a1
      symbol: V_S0
      relationship: identical
    - constraint: cfr-25.527-a2
      symbol: V_S0
      relationship: identical
    - constraint: cfr-25.533-c1-distributed-pressure
      symbol: V_S0
      relationship: identical
    - constraint: cfr-25.535-b-step-load
      symbol: V_S0
      relationship: identical
    - constraint: cfr-25.535-f-immersed-drag-and-side
      symbol: V_S0
      relationship: subset
      caveats: >-
        UNIT UNRESOLVED in that constraint. § 25.535(f) is the only water load
        formula written in genuine physical quantities, so its dimensions must
        close on their own and only do so with the speed in ft/s, while the
        glossary says knots. A factor of 2.85. Do not bind this parameter to
        that constraint until the question is settled.
  distinct_from: [stall-speed-takeoff-flaps]
  verification:
    status: verified
    checked_against: 14 CFR 25.527(b)(3) and 25.533(c)(1) full text, eCFR issue 2026-07-07.
  tags: [speeds, part-25, water-loads]

- id: stall-speed-takeoff-flaps
  name: Stalling speed at design water takeoff weight, takeoff flaps
  aliases: [V_S1, VS1, takeoff stall speed]
  quantity:
    unit: unit:KN
    symbol: kn
    quantity_kind: quantitykind:Speed
  definition: >-
    Seaplane stalling speed at the design water takeoff weight with flaps
    extended in the appropriate TAKEOFF position.
  measurement_convention:
    datum: At the design water takeoff weight — a different weight from V_S0's.
    station: n/a
    source: 14 CFR 25.533(b)(1), 25.531(b)
    notes: >-
      Two things differ from V_S0 at once: the flap position and the weight the
      speed is evaluated at. A tool carrying a single stall speed cannot
      express either difference.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  regulatory_mapping:
    - constraint: cfr-25.533-b1-keel-pressure
      symbol: V_S1
      relationship: identical
    - constraint: cfr-25.533-b2-flared-chine-pressure
      symbol: V_S1
      relationship: identical
    - constraint: cfr-25.531-b-takeoff-inertia-load-factor
      symbol: V_S1
      relationship: identical
  distinct_from: [stall-speed-landing-flaps]
  verification:
    status: verified
    checked_against: 14 CFR 25.533(b)(1) and 25.531(b) full text, eCFR issue 2026-07-07.
  tags: [speeds, part-25, water-loads, takeoff]

- id: design-cruising-speed
  name: Design cruising speed VC
  aliases: [VC, V_C]
  quantity:
    unit: unit:KN
    symbol: kn
    quantity_kind: quantitykind:Speed
  definition: >-
    Design cruising speed. The upper limit of the constant negative limit
    manoeuvring load factor.
  measurement_convention:
    datum: Equivalent airspeed.
    station: n/a
    source: 14 CFR 25.337(c), 25.335(a)
    notes: >-
      § 25.335 establishes the design airspeeds and has NOT yet been read into
      this corpus. This parameter therefore names a quantity whose defining
      section is an open item.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  regulatory_mapping:
    - constraint: cfr-25.337-c1-negative-limit-to-vc
      symbol: V_C
      relationship: identical
    - constraint: cfr-25.337-c2-negative-varies-to-vd
      symbol: V_C
      relationship: identical
  distinct_from: [design-dive-speed]
  verification:
    status: partial
    checked_against: >-
      14 CFR 25.337(c) full text, eCFR issue 2026-07-07. The defining section
      25.335 has not been read.
  tags: [speeds, part-25, flight-loads]

- id: design-dive-speed
  name: Design dive speed VD
  aliases: [VD, V_D]
  quantity:
    unit: unit:KN
    symbol: kn
    quantity_kind: quantitykind:Speed
  definition: >-
    Design dive speed. The speed at which the negative limit manoeuvring load
    factor reaches zero.
  measurement_convention:
    datum: Equivalent airspeed.
    station: n/a
    source: 14 CFR 25.337(c)(2), 25.335(b)
    notes: >-
      Must be strictly greater than V_C: cfr-25.337-c2-negative-varies-to-vd
      divides by (V_D - V_C), so an equal pair is a division by zero rather
      than a degenerate but valid answer.
  bounds:
    min: 0.0
    min_exclusive: true
  bounds_basis: mathematical
  bounds_rationale: >-
    Positive, and strictly greater than design-cruising-speed. The second part
    is a relation between parameters rather than a bound on one, and this
    schema has no way to state it — recorded here in prose.
  regulatory_mapping:
    - constraint: cfr-25.337-c2-negative-varies-to-vd
      symbol: V_D
      relationship: identical
  distinct_from: [design-cruising-speed]
  verification:
    status: partial
    checked_against: >-
      14 CFR 25.337(c)(2) full text, eCFR issue 2026-07-07. The defining
      section 25.335 has not been read.
  tags: [speeds, part-25, flight-loads]

# ---------------------------------------------------------------------------
# Inertia ratios
# ---------------------------------------------------------------------------

- id: pitch-gyration-ratio
  name: Station-to-CG distance over pitch radius of gyration
  aliases: [r_x, rx]
  quantity:
    unit: unit:UNITLESS
    symbol: "1"
    quantity_kind: quantitykind:DimensionlessRatio
  definition: >-
    Ratio of the distance, measured parallel to the hull reference axis, from
    the centre of gravity to the hull longitudinal station being computed, to
    the pitch radius of gyration of the seaplane.
  measurement_convention:
    datum: >-
      From the CG, parallel to the hull reference axis — the straight line in
      the plane of symmetry tangential to the keel at the main step.
    station: >-
      Per station. Zero at the CG station and growing toward bow and stern,
      which is what makes the bow and stern cases of 25.527(a)(2) milder than
      the raw K1 values alone suggest.
    source: 14 CFR 25.527(b)(7)
    notes: >-
      Measured FROM THE CG, so cfr-25.523-b-critical-cg makes this a swept
      quantity: moving the CG within the certified envelope changes it at every
      station simultaneously.
  bounds:
    min: 0.0
  bounds_basis: mathematical
  regulatory_mapping:
    - constraint: cfr-25.527-a2
      symbol: r_x
      relationship: identical
    - constraint: cfr-25.523-b-critical-cg
      symbol: r_x
      relationship: derived
      caveats: >-
        25.523(b) does not name r_x. It requires critical CG positions to be
        considered, and r_x is measured from the CG, so the requirement
        propagates into this parameter as a sweep rather than a value.
  distinct_from: [roll-gyration-ratio]
  verification:
    status: verified
    checked_against: 14 CFR 25.527(b)(7) full text, eCFR issue 2026-07-07.
  tags: [inertia, part-25, water-loads]

- id: roll-gyration-ratio
  name: Float lateral offset over roll radius of gyration
  aliases: [r_y, ry]
  quantity:
    unit: unit:UNITLESS
    symbol: "1"
    quantity_kind: quantitykind:DimensionlessRatio
  definition: >-
    Ratio of the lateral distance between the centre of gravity and the plane
    of symmetry of an AUXILIARY FLOAT, to the radius of gyration in roll.
  measurement_convention:
    datum: Lateral, from the CG to the float's plane of symmetry.
    station: n/a
    source: 14 CFR 25.535(b)
    notes: >-
      The lateral analogue of r_x, and a plausible thing to substitute r_x
      into. Both appear as (1 + r^2)^(2/3) in their respective denominators, so
      the substitution yields a believable number rather than an obvious error.
  bounds:
    min: 0.0
  bounds_basis: mathematical
  regulatory_mapping:
    - constraint: cfr-25.535-b-step-load
      symbol: r_y
      relationship: identical
  distinct_from: [pitch-gyration-ratio]
  verification:
    status: verified
    checked_against: 14 CFR 25.535(b) full text, eCFR issue 2026-07-07.
  tags: [inertia, part-25, auxiliary-float]
