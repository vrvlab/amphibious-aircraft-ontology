# Schema for a design parameter — an engineering quantity with a canonical
# definition, a unit, a measurement convention, and links to the regulatory
# symbols it corresponds to.
#
# WHY THIS LAYER EXISTS
#
# `constraints/` encodes what the regulation requires. It does not say what the
# quantities in those formulas correspond to in a design tool. 14 CFR 25.527
# uses `beta`; a parametric model has `deadrise_fwd` and `deadrise_aft`. These
# describe the same physical quantity under different conventions, and nothing
# currently connects them. A wrong mapping feeds a wrong number into a load
# factor with nothing to catch it.
#
# Existing frameworks cover one side each and neither covers the join:
#   CPACS       parametric geometry, no regulatory meaning
#   14 CFR      regulatory meaning, no parametric geometry
#
# UNITS
#
# Units are QUDT IRIs, not strings. QUDT originated at NASA Ames (NExIOM /
# Constellation), is RDF/OWL so it is usable directly by a reasoner, and
# cross-references UCUM, UNECE and IEC 61360. A `symbol` field carries the
# CPACS-style bracket form for human readability.
#
# Units are NEVER encoded in parameter names. CPACS development guidelines §5
# ("element names are descriptive, without abbreviations or symbols") and QUDT
# (a unit is a property of a quantity) agree on this.

id: string                      # stable slug, e.g. deadrise-forebody
name: string                    # human-readable
aliases: [string]               # other names in use for the same quantity

quantity:
  unit: string                  # QUDT IRI, prefixed — "unit:DEG"
  symbol: string                # CPACS-style — "deg", "m", "1"
  quantity_kind: string         # QUDT IRI — "quantitykind:Angle"

definition: string              # what the quantity IS, independent of any tool

# HOW the quantity is measured. Two tools can agree on a definition and still
# disagree on a value if they measure at different stations or from different
# datums. This block is where that gets pinned down.
measurement_convention:
  datum: string                 # what it is measured from or relative to
  station: string               # where along the hull, if station-dependent
  source: string                # the document that fixes the convention
  notes: string

# Links to regulatory symbols. `relationship` must be one of:
#   identical      — the same quantity, same convention
#   discretization — the tool samples a continuous regulatory quantity
#   subset         — the tool value applies over part of the regulatory domain
#   derived        — computed from, not equal to
#   selects        — the value determines WHICH regulatory case applies
regulatory_mapping:
  - constraint: string          # constraint id in constraints/
    symbol: string              # the symbol as it appears in that constraint
    relationship: string
    caveats: string             # REQUIRED when relationship is not `identical`

# Where the quantity appears in real tools. Descriptive, not normative.
implementations:
  - system: string
    identifier: string
    unit: string                # QUDT IRI as that system uses it
    bounds: [number, number]
    notes: string

verification:
  status: string                # verified | partial | unverified | interpretation
  checked_against: string
  notes: string

tags: [string]
