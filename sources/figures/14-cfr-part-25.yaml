# Published figure registry — 14 CFR Part 25.
#
# The regulation prints its equations as raster images. Not as text with a
# figure beside it: the paragraph says "computed as follows:", renders a PNG,
# and then defines the variables. Every formula in §§ 25.527, 25.531, 25.533 and
# 25.535 arrives this way, and a pipeline whose first step is to mine the
# regulatory text misses all of them silently.
#
# APPENDIX B IS THE EXTREME CASE. Its entire text content is twenty-one
# characters — the words "Appendix B to Part 25". Nothing else. The appendix is
# three images and a title, which is why the versioner's `appendix=` endpoint
# looked like it was returning an empty document: it was not failing, there is
# genuinely no text to return. For Appendix B, digesting the images is not a
# fallback for a missing text digest. It is the only verification that exists.
#
# So each record carries a sha256 of the image BYTES as fetched. The images are
# byte-stable — the server sends a fixed file with an ETag, not a re-render per
# request, which was checked against repeated fetches before relying on it.
# tools/check_editions.py re-fetches and compares.
#
# What this catches that a text digest cannot: a figure redrawn, replaced or
# re-rendered while the surrounding regulatory text stands untouched.
#
# `last_modified` is the HTTP header the server reports. It is evidence about
# the FILE, not about the regulation — 2022-05-20 is when the image was last
# written to that server and says nothing about when the figure was adopted.

