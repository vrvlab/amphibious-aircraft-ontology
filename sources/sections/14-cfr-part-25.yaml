# Source registry — 14 CFR Part 25.
#
# One record per regulatory SECTION, not per constraint entry. Sixty-six entries
# cite eighteen sections, so edition metadata carried on each entry would be
# duplicated roughly fivefold and would drift apart the first time one copy was
# updated and another was not.
#
# WHY THIS EXISTS
#
# A constant is not a fact. It is a fact as of an issue date.
#
# 14 CFR 25.535(d) specified a side load coefficient of 3.25 tan beta from 1964
# until 2022, when Amdt. 25-148 corrected it to 0.25 -- a thirteenfold change
# that stood for fifty-eight years. The same amendment changed 25.525(b) from
# citing 25.533(b) to citing 25.533(c), moving which pressure case governs a
# distributed load. Neither change announced itself. Both were found by diffing
# the regulation against itself across dates.
#
# So each record carries a DIGEST of the section text as it stood at `edition`.
# tools/check_editions.py re-fetches the section and compares. Any change to the
# regulation -- amended, corrected, or silently re-rendered -- shows up as a
# digest mismatch, whether or not the amendment citation line moved with it.
#
# FIELDS
#
#   edition            eCFR issue date the text was read from
#   retrieved          when it was actually fetched
#   effective_from     date the CURRENT text took effect, from the last
#                      amendment in the citation line, or the original adoption
#   amendment_history  the bracketed FR citation line, verbatim. This is the
#                      authoritative amendment list and is quoted rather than
#                      parsed into fields, because the parse is lossy and the
#                      line is short.
#   text_sha256        sha256 of the section text, tags stripped and whitespace
#                      collapsed, first 16 hex characters
#   text_chars         length of that normalised text, a cheap corroborating
#                      check that a digest mismatch is a real edit
#   history_verified_from
#                      the earliest date this section's text has actually been
#                      COMPARED against. Above it the corpus can say whether the
#                      section changed; below it, it cannot. A claim about
#                      evidence held, not an assertion that nothing happened.
#   history_method     how that was established, so it can be audited.
#
# WHY APPENDIX B HAS NO RECORD HERE. It has no text to digest. Its entire text
# content is twenty-one characters -- the words "Appendix B to Part 25" -- and
# everything else in it is three images. The versioner's `appendix=` endpoint
# looked broken when it returned an empty document; it was not, there is simply
# nothing to return. Appendix B lives in sources/figures/ instead, where the
# image bytes are digested, and that is the only verification available for it.
#
# A NOTE ON HORIZONS. eCFR's own version history begins 2016-12-30; everything
# before that is a single baseline snapshot. The citation line does not have
# that limit -- it reaches back to original adoption in 1964 -- which is why it
# is stored verbatim rather than reconstructed from the versions API.

