- id: unit:LB_F
  name: pound-force
  symbol: "lbf"
  ucum: "[lbf_av]"
  quantity_kinds: [quantitykind:Force]
  dimension: {T: -2, L: 1, M: 1, I: 0, Theta: 0, N: 0, J: 0}
  si_coherent: false
  to_coherent_si:
    unit: unit:N
    factor: "4.4482216152605"
    exact: true
    expression: "0.45359237*9.80665"
    basis: >-
      NIST SP 811 Appendix B footnote to pound-force: "The exact conversion
      factor is 4.448 221 615 260 5 E+00", the avoirdupois pound (exactly
      0.453 592 37 kg, its own footnote) times the standard acceleration of
      gravity (9.806 65 m/s^2, exact, B.8).
  source:
    document: "NIST Special Publication 811, Guide for the Use of the International System of Units (SI)"
    edition: "2008 Edition"
    location: "Appendix B.8, pound-force (lbf) and its footnote; pound (avoirdupois) and its footnote; acceleration of free fall, standard"
    url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication811e2008.pdf
  verification:
    status: verified
    checked_against: >-
      NIST SP 811 2008 Edition (PDF sha256 788dd8f0bcb0...482f as fetched
      2026-09-18), Appendix B.8 and the two footnotes, read. QUDT record
      https://qudt.org/vocab/unit/LB_F: 4.448221615260499999999999999999998.

- id: unit:PSI
  name: pound-force per square inch
  symbol: "psi"
  ucum: "[psi]"
  quantity_kinds: [quantitykind:Pressure]
  dimension: {T: -2, L: -1, M: 1, I: 0, Theta: 0, N: 0, J: 0}
  si_coherent: false
  to_coherent_si:
    unit: unit:PA
    factor: "6894.757293168362"
    exact: false
    expression: "4.4482216152605/0.0254^2"
    basis: >-
      The exact pound-force over the square of the exact inch (NIST SP 811
      B.8: inch to meter, 2.54 E-02, bold). B.8 prints the rounded
      6.894 757 E+03.
  source:
    document: "NIST Special Publication 811, Guide for the Use of the International System of Units (SI)"
    edition: "2008 Edition"
    location: "Appendix B.8, pound-force per square inch (psi); inch (in); pound-force (lbf)"
    url: https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication811e2008.pdf
  verification:
    status: verified
    checked_against: >-
      NIST SP 811 2008 Edition, Appendix B.8, read 2026-09-18. The quotient is
      this corpus's arithmetic and agrees with QUDT's conversionMultiplier
      6894.757293168361336722673445346887 for unit:PSI to seventeen digits.
