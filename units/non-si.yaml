# Units that are not coherent SI: the regulation's own, and the degree.
#
# 14 CFR Part 25 writes weights in pounds, speeds in knots, pressures in pounds per square
# inch and volumes in cubic feet, and its empirical constants are fitted to those units. The
# parameters keep the regulation's units for that reason. A consumer that is SI inside
# converts at the boundary, by the factor recorded here and by no other.
#
# `exact: true` means the decimal string IS the value. Where the exact value is not a finite
# decimal (pi/180, 1852/3600, a quotient), `expression` holds it and `factor` is the shortest
# decimal that reads back as the nearest double.

- id: unit:MilliM
  name: millimetre
  symbol: "mm"
  ucum: "mm"
  quantity_kinds: [quantitykind:Length]
  dimension: {T: 0, L: 1, M: 0, I: 0, Theta: 0, N: 0, J: 0}
  si_coherent: false
  to_coherent_si:
    unit: unit:M
    factor: "0.001"
    exact: true
    basis: SI prefix milli, 10^-3. SI Brochure Table 7. A prefixed unit is SI and is not coherent (section 2.3.4).
  source:
    document: "The International System of Units (SI), BIPM"
    edition: "9th edition (2019), V4.01, June 2026"
    location: "Table 7 (SI prefixes); section 2.3.4 (coherent units)"
    url: https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf
  verification:
    status: verified
    checked_against: >-
      SI Brochure 9th edition V4.01 (June 2026), Table 7 and section 2.3.4, read
      from the PDF. QUDT record https://qudt.org/vocab/unit/MilliM fetched
      2026-09-18: conversionMultiplier 0.001.

