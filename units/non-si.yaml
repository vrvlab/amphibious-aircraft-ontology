  quantity_kinds: [quantitykind:Angle]
  dimension: {T: 0, L: 0, M: 0, I: 0, Theta: 0, N: 0, J: 0}
  si_coherent: false
  to_coherent_si:
    unit: unit:RAD
    factor: "0.017453292519943295"
    exact: false
    expression: "pi/180"
    basis: "SI Brochure Table 8: 1 degree = (pi/180) rad."
  source:
    document: "The International System of Units (SI), BIPM"
    edition: "9th edition (2019), V4.01, June 2026"
    location: "Table 8 (non-SI units accepted for use with the SI), plane and phase angle"
    url: https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf
  verification:
    status: verified
    checked_against: >-
      SI Brochure 9th edition V4.01 (June 2026), Table 8, read from the PDF.
      QUDT record https://qudt.org/vocab/unit/DEG fetched 2026-09-18:
      conversionMultiplier 0.01745329251994329576923690768488613, which
      rounds to the factor here.

- id: unit:KN
  name: knot
  symbol: "kn"
  ucum: "[kn_i]"
  quantity_kinds: [quantitykind:Speed]
  dimension: {T: -1, L: 1, M: 0, I: 0, Theta: 0, N: 0, J: 0}
  si_coherent: false
  to_coherent_si:
    unit: unit:M-PER-SEC
    factor: "0.5144444444444445"
    exact: false
    expression: "1852/3600"
    basis: "SI Brochure Table 8: 1 nautical mile = 1852 m; 1 nautical mile per hour = (1852/3600) m/s."
  source:
    document: "The International System of Units (SI), BIPM"
    edition: "9th edition (2019), V4.01, June 2026"
    location: "Table 8, knot, and its note (k)"
    url: https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf
  verification:
    status: verified
    checked_against: >-
      SI Brochure 9th edition V4.01 (June 2026), Table 8, read from the PDF.
      NIST SP 811 (2008) B.8 gives the rounded 5.144 444 E-01. QUDT record
      https://qudt.org/vocab/unit/KN fetched 2026-09-18.
    notes: >-
      The Brochure gives the knot no symbol. "kn" is the corpus's, as it was
      before this registry existed.

