      UCUM code QUDT records, the quantity kinds it lists the unit under and the
      dimension vector A0E0L-2I0M1H0T0D0.
    notes: >-
      The Brochure's name for the quantity is surface density; QUDT's kind is MassPerArea,
      whose description gives surface density as a synonym. UCUM 2.2 lists kg/m2 by name. It
      is a mass per area and not a pressure: a floor loading stated in it is a mass, and
      becomes a pressure only by standard gravity.

