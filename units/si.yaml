- id: unit:PER-M
  name: reciprocal metre
  symbol: "m^-1"
  ucum: "m-1"
  quantity_kinds: [quantitykind:CurvatureFromRadius, quantitykind:InverseLength]
  dimension: {T: 0, L: -1, M: 0, I: 0, Theta: 0, N: 0, J: 0}
  si_coherent: true
  source:
    document: "The International System of Units (SI), BIPM"
    edition: "9th edition (2019), V4.01, June 2026"
    location: "Table 5 (wavenumber, m-1)"
    url: https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf
  verification:
    status: verified
    checked_against: >-
      SI Brochure 9th edition V4.01 (June 2026), Table 5 (wavenumber, m-1), read from the PDF
      (sha256 5442eea2c680...e02c as fetched 2026-09-21). QUDT record
      https://qudt.org/vocab/unit/PER-M fetched 2026-09-21 for the IRI, the
      UCUM code QUDT records, the quantity kinds it lists the unit under and the
      dimension vector A0E0L-1I0M0H0T0D0.
    notes: >-
      The Brochure tabulates the unit under wavenumber and names no curvature. The kind a
      consumer needs for the curvature of a line is QUDT's CurvatureFromRadius, which is the
      one QUDT labels "Curvature" and lists this unit under; QUDT's other kind of that label,
      quantitykind:Curvature, has the same dimension and lists no applicable unit, so it is
      not recorded here. The UCUM code is the specification's own spelling of a reciprocal:
      its tables define the Kayser as 1 cm-1 and the siemens as 1 Ohm-1.

