# The coherent SI units the corpus and its consumers use.
#
# Dimensions are the SI Brochure's, Table 3. QUDT gives plane angle and the unit one a
# dimension vector with D1 (its own 'dimensionless' marker); the Brochure gives both all
# zeros, and that is what is recorded. The kind, not the dimension, tells them apart.
#
# `ucum` is the code a consumer writes, in the form a person would: UCUM 2.2 section 7 gives
# division its own operator, so kilogram per cubic metre is `kg/m3`, which the specification's
# own Appendix D lists. QUDT records the same unit as `kg.m-3`; both are valid and equal, and
# where QUDT's differs it is kept beside as `ucum_qudt`, a cross-reference and not the code.
# QUDT records no code for the unit one; UCUM writes it `1` (section 8: a positive integer
# may stand in place of a unit symbol).

- id: unit:M
  name: metre
  symbol: "m"
  ucum: "m"
  quantity_kinds: [quantitykind:Length]
  dimension: {T: 0, L: 1, M: 0, I: 0, Theta: 0, N: 0, J: 0}
  si_coherent: true
  source:
    document: "The International System of Units (SI), BIPM"
    edition: "9th edition (2019), V4.01, June 2026"
    location: "Table 2 (base units), Table 3 (dimensions)"
    url: https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf
  verification:
    status: verified
    checked_against: >-
      SI Brochure 9th edition V4.01 (June 2026), Table 2 (base units), Table 3 (dimensions), read from the PDF
      (sha256 5442eea2c680...e02c as fetched 2026-09-18). QUDT record
      https://qudt.org/vocab/unit/M fetched 2026-09-18 for the IRI, the
      UCUM code QUDT records and the dimension vector A0E0L1I0M0H0T0D0.

